# The advisories the universal package `ohmyrasp` lists as `fixes` in its Beefile.
#
# shirudo's backend reads `fixes` (at most 16 IDs per upatch) to show which loaded upatch covers an
# advisory a node is exposed to. The list means: the agent blocks the tested exploit path of that
# advisory inside the JVM; it does not patch the vulnerable library.
#
# Each entry names the Vulhub acceptance script that shows it: the unprotected container is exploited,
# and the protected container, given the same request, is not and logs a block event. Paths are
# relative to java-agent/. fixes_check.py (called by gen-readmes.py) writes the `fixes` line of
# ohmyrasp/Beefile from this file and checks each entry against the evidence ledger and the script.
# A script that only shows a legacy-JDK or setup/license boundary is not evidence and is refused.
#
# To add an advisory, add an entry here and run: python3 deploy/shirudo/gen-readmes.py

[[fix]]
id = "CVE-2021-44228"
scripts = ["acceptance/vulhub/log4j/solr-java8.sh"]

[[fix]]
id = "CVE-2022-22965"
scripts = ["acceptance/vulhub/spring/java11.sh"]

[[fix]]
id = "CVE-2022-22963"
scripts = ["acceptance/vulhub/spring/function-java8.sh"]

[[fix]]
id = "CVE-2022-22947"
scripts = ["acceptance/vulhub/spring/gateway-java8.sh"]

[[fix]]
id = "CVE-2017-5638"
scripts = ["acceptance/vulhub/struts2/s2045-java8.sh", "acceptance/vulhub/struts2/s2046-java8.sh"]

