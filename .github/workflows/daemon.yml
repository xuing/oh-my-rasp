name: daemon

on:
  push:
    paths:
      - "daemon/**"
      - ".github/workflows/daemon.yml"
  pull_request:
    paths:
      - "daemon/**"
      - ".github/workflows/daemon.yml"
  schedule:
    - cron: "37 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-test:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: daemon
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the repository-pinned Rust toolchain
        # rustup reads daemon/rust-toolchain.toml and installs it on demand.
        run: cargo --version
      - name: Check formatting
        run: cargo fmt --check
      - name: Clippy
        run: cargo clippy --locked --all-targets -- -D warnings
      - name: Build
        run: cargo build --locked
      - name: Test
        run: cargo test --locked
      - name: Build production container
        run: docker build .
