name: ohmyrasp-release

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      version:
        description: Release version without the leading v, for example 0.1.0.
        required: true
        type: string

permissions:
  contents: read

jobs:
  test-api:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          check-latest: true
          cache-dependency-path: api/go.sum
      - run: go test ./...

  test-console:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: lts/*
          check-latest: true
          cache: npm
          cache-dependency-path: console/package-lock.json
      - run: npm ci
      - run: npm run build

  build-agents:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check detector false-positive-suppression parity
        working-directory: java-agent
        run: bash scripts/check-detector-parity.sh
      - name: Build, test, and verify Java agents and shirudo upatch JARs
        run: |
          set -euo pipefail
          gradle_image="$(awk '$1 == "FROM" && $2 ~ /^gradle:/ { print $2; exit }' java-agent/Dockerfile)"
          test -n "$gradle_image"
          docker run --pull always --rm \
            -u "$(id -u):$(id -g)" \
            -e GRADLE_USER_HOME=/tmp/gradle-home \
            -v "$PWD/java-agent:/workspace" \
            -w /workspace \
            "$gradle_image" \
            gradle --no-daemon --no-problems-report clean check \
            :agent-jdk25:jdk21Jars \
            :agent-java8:shirudoUpatchJar \
            :agent-java11:shirudoUpatchJar \
            :agent-java17:shirudoUpatchJar \
            :agent-jdk25:shirudoUpatchJar
      - name: Stage and validate shirudo upatch packages
        run: |
          set -euo pipefail
          ./deploy/shirudo/stage-jars.sh
          ./deploy/shirudo/verify-shirudo-upatch.sh
          mkdir -p dist
          tar -chzf dist/ohmyrasp-shirudo-upatches.tar.gz -C deploy/shirudo \
            README.md verify-shirudo-upatch.sh \
            ohmyrasp-java8/Beefile ohmyrasp-java8/README.md ohmyrasp-java8/build.sh ohmyrasp-java8/ohmyrasp-java8.jar \
            ohmyrasp-java11/Beefile ohmyrasp-java11/README.md ohmyrasp-java11/build.sh ohmyrasp-java11/ohmyrasp-java11.jar \
            ohmyrasp-java17/Beefile ohmyrasp-java17/README.md ohmyrasp-java17/build.sh ohmyrasp-java17/ohmyrasp-java17.jar \
            ohmyrasp-jdk21/Beefile ohmyrasp-jdk21/README.md ohmyrasp-jdk21/build.sh ohmyrasp-jdk21/ohmyrasp-jdk21.jar \
            ohmyrasp-jdk25/Beefile ohmyrasp-jdk25/README.md ohmyrasp-jdk25/build.sh ohmyrasp-jdk25/ohmyrasp-jdk25.jar
      - name: Upload Java agent release artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-agents
          path: |
            java-agent/agent-java8/build/libs/ohmyrasp-agent-java8.jar
            java-agent/agent-java11/build/libs/ohmyrasp-agent-java11.jar
            java-agent/agent-java17/build/libs/ohmyrasp-agent-java17.jar
            java-agent/agent-jdk25/build/libs/ohmyrasp-agent.jar
            java-agent/agent-jdk25/build/jdk21/ohmyrasp-agent-jdk21.jar
            java-agent/agent-jdk25/build/jdk21/ohmyrasp-jdk21.jar
            java-agent/agent-java8/build/libs/ohmyrasp-java8.jar
            java-agent/agent-java11/build/libs/ohmyrasp-java11.jar
            java-agent/agent-java17/build/libs/ohmyrasp-java17.jar
            java-agent/agent-jdk25/build/libs/ohmyrasp-jdk25.jar
            dist/ohmyrasp-shirudo-upatches.tar.gz
            dist/jdk21/ohmyrasp-jdk21-shirudo.tar.gz
          if-no-files-found: error
          retention-days: 1

  build-daemon:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test and build Rust daemon
        working-directory: daemon
        run: |
          set -euo pipefail
          cargo test --locked
          cargo build --locked --release
      - name: Package daemon release tarball
        run: |
          set -euo pipefail
          mkdir -p dist
          tar -czf dist/ohmyrasp-daemon-linux-amd64.tar.gz -C daemon/target/release ohmyrasp-daemon
      - name: Upload daemon release artifact
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-daemon
          path: dist/ohmyrasp-daemon-linux-amd64.tar.gz
          if-no-files-found: error
          retention-days: 1

  release:
    needs:
      - test-api
      - test-console
    runs-on: ubuntu-latest
    permissions:
      id-token: write
      contents: read
      packages: write
      attestations: write
      artifact-metadata: write
    outputs:
      version: ${{ steps.release.outputs.version }}
      namespace: ${{ steps.release.outputs.namespace }}
      short_sha: ${{ steps.release.outputs.short_sha }}
    env:
      REGISTRY: ghcr.io
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Resolve release metadata
        id: release
        shell: bash
        run: |
          set -euo pipefail

          if [[ "${{ github.event_name }}" == "workflow_dispatch" ]]; then
            version="${{ inputs.version }}"
          else
            version="${GITHUB_REF_NAME#v}"
          fi

          if [[ ! "$version" =~ ^[0-9]+\.[0-9]+\.[0-9]+(-[0-9A-Za-z][0-9A-Za-z.-]*)?$ ]]; then
            echo "Release version must be a Docker-tag-safe semantic version without build metadata." >&2
            exit 1
          fi

          namespace="$(echo "${GITHUB_REPOSITORY_OWNER}" | tr '[:upper:]' '[:lower:]')"
          short_sha="${GITHUB_SHA::12}"

          {
            echo "version=${version}"
            echo "namespace=${namespace}"
            echo "short_sha=${short_sha}"
          } >> "$GITHUB_OUTPUT"

      - name: Stamp chart and default image tags
        run: deploy/scripts/set-release-version.sh "${{ steps.release.outputs.version }}" "${{ steps.release.outputs.namespace }}" "$REGISTRY"

      - name: Log in to GHCR
        shell: bash
        run: echo "${{ secrets.GITHUB_TOKEN }}" | docker login "$REGISTRY" -u "${{ github.actor }}" --password-stdin

      - name: Configure Docker Buildx
        shell: bash
        run: |
          set -euo pipefail
          docker buildx create --name ohmyrasp-release-builder --use || docker buildx use ohmyrasp-release-builder
          docker buildx inspect --bootstrap

      - name: Build and push API image
        id: build_api
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          image="${REGISTRY}/${{ steps.release.outputs.namespace }}/control-api"
          metadata_file="dist/control-api-build-metadata.json"
          docker buildx build \
            --platform linux/amd64 \
            --attest type=sbom \
            --attest type=provenance,mode=max \
            --build-arg VERSION="${{ steps.release.outputs.version }}" \
            --build-arg REVISION="${GITHUB_SHA}" \
            --build-arg SOURCE="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --tag "${image}:${{ steps.release.outputs.version }}" \
            --tag "${image}:sha-${{ steps.release.outputs.short_sha }}" \
            --metadata-file "$metadata_file" \
            --push \
            api
          digest="$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["containerimage.digest"])' "$metadata_file")"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Attest API image provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ steps.release.outputs.namespace }}/control-api
          subject-digest: ${{ steps.build_api.outputs.digest }}
          push-to-registry: true

      - name: Build and push web image
        id: build_web
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          image="${REGISTRY}/${{ steps.release.outputs.namespace }}/control-web"
          metadata_file="dist/control-web-build-metadata.json"
          docker buildx build \
            --platform linux/amd64 \
            --attest type=sbom \
            --attest type=provenance,mode=max \
            --build-arg VERSION="${{ steps.release.outputs.version }}" \
            --build-arg REVISION="${GITHUB_SHA}" \
            --build-arg SOURCE="${GITHUB_SERVER_URL}/${GITHUB_REPOSITORY}" \
            --tag "${image}:${{ steps.release.outputs.version }}" \
            --tag "${image}:sha-${{ steps.release.outputs.short_sha }}" \
            --metadata-file "$metadata_file" \
            --push \
            console
          digest="$(python3 -c 'import json, sys; print(json.load(open(sys.argv[1], encoding="utf-8"))["containerimage.digest"])' "$metadata_file")"
          echo "digest=${digest}" >> "$GITHUB_OUTPUT"

      - name: Attest web image provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-name: ${{ env.REGISTRY }}/${{ steps.release.outputs.namespace }}/control-web
          subject-digest: ${{ steps.build_web.outputs.digest }}
          push-to-registry: true

      - name: Scan release images for high and critical CVEs
        run: |
          deploy/scripts/scan-release-images.sh \
            "${REGISTRY}/${{ steps.release.outputs.namespace }}/control-api:${{ steps.release.outputs.version }}" \
            "${REGISTRY}/${{ steps.release.outputs.namespace }}/control-web:${{ steps.release.outputs.version }}"

      - name: Package and push Helm chart
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.release.outputs.version }}
          IMAGE_NAMESPACE: ${{ steps.release.outputs.namespace }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          helm_image="$(deploy/scripts/resolve-tool-image.sh helm)"
          docker run --rm --entrypoint sh \
            -e GITHUB_TOKEN \
            -e GITHUB_ACTOR \
            -e VERSION \
            -e IMAGE_NAMESPACE \
            -v "$PWD":/work \
            -w /work \
            "$helm_image" -c '
              set -eu
              echo "$GITHUB_TOKEN" | helm registry login ghcr.io -u "$GITHUB_ACTOR" --password-stdin
              helm lint deploy/helm/ohmyrasp-control
              helm package deploy/helm/ohmyrasp-control --destination dist
              sha256sum "dist/ohmyrasp-control-${VERSION}.tgz" > "dist/ohmyrasp-control-${VERSION}.tgz.sha256"
              helm push "dist/ohmyrasp-control-${VERSION}.tgz" "oci://ghcr.io/${IMAGE_NAMESPACE}/charts"
            '

      - name: Attest Helm chart package provenance
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: dist/ohmyrasp-control-${{ steps.release.outputs.version }}.tgz

      - name: Upload Helm chart archive
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-helm-chart
          path: dist/ohmyrasp-control-${{ steps.release.outputs.version }}.tgz
          if-no-files-found: error
          retention-days: 1

  github-release:
    needs:
      - release
      - build-agents
      - build-daemon
    runs-on: ubuntu-latest
    permissions:
      contents: write
      id-token: write
      attestations: write
      artifact-metadata: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Download release artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: dist-staging
          merge-multiple: true

      - name: Assemble release assets and checksums
        env:
          VERSION: ${{ needs.release.outputs.version }}
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist
          find dist-staging -maxdepth 6 -type f \( -name '*.jar' -o -name '*.tar.gz' -o -name '*.tgz' \) -print0 |
            while IFS= read -r -d '' f; do
              base="$(basename "$f")"
              if [[ "$base" == "ohmyrasp-shirudo-upatches.tar.gz" ]]; then
                cp "$f" "dist/ohmyrasp-shirudo-upatches-${VERSION}.tar.gz"
              else
                cp "$f" "dist/$base"
              fi
            done
          (
            cd dist
            LC_ALL=C sha256sum ./* > SHA256SUMS.txt
          )
          ls -lh dist

      - name: Attest agent, shirudo upatch, and daemon release artifacts
        uses: actions/attest@1e69f48acb82d1966a394da916b4c1698aa569d6 # v4.2.2
        with:
          subject-path: |
            dist/*.jar
            dist/ohmyrasp-shirudo-upatches-*.tar.gz
            dist/ohmyrasp-jdk21-shirudo.tar.gz
            dist/ohmyrasp-daemon-*.tar.gz

      - name: Create or update GitHub Release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ needs.release.outputs.version }}
          REF: v${{ needs.release.outputs.version }}
          DIST_DIR: dist
          EXPECTED_ASSETS: 15
          IMAGE_NAMESPACE: ${{ needs.release.outputs.namespace }}
          REGISTRY: ghcr.io
          EVENT_NAME: ${{ github.event_name }}
        run: ./deploy/scripts/publish-github-release.sh
