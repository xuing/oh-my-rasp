name: supply-chain

on:
  pull_request:
  schedule:
    - cron: "42 5 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  govulncheck:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: api
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          check-latest: true
          cache-dependency-path: api/go.sum
      - name: Install govulncheck
        run: go install golang.org/x/vuln/cmd/govulncheck@latest
      - name: Run govulncheck
        # Exits non-zero when a reachable vulnerability is found.
        run: |
          "$(go env GOPATH)/bin/govulncheck" ./...

  cargo-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: daemon
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Install the repository-pinned Rust toolchain
        # rustup reads daemon/rust-toolchain.toml and installs it on demand.
        run: cargo --version
      - name: Install cargo-audit
        # Intentionally resolve the newest cargo-audit on every scheduled run.
        run: cargo install cargo-audit --locked
      - name: Run cargo audit
        # Exits non-zero when a known advisory affects the dependency tree.
        run: cargo audit

  npm-audit:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: node
          check-latest: true
          cache: npm
          cache-dependency-path: console/package-lock.json
      - run: npm ci
      - run: npm audit --audit-level=high
