name: agent

on:
  push:
    paths:
      - "java-agent/**"
      - "deploy/shirudo/**"
      - ".github/workflows/agent.yml"
  pull_request:
    paths:
      - "java-agent/**"
      - "deploy/shirudo/**"
      - ".github/workflows/agent.yml"
  schedule:
    # Re-resolve each JDK major every week so new CPU releases are tested even
    # when no source file changed.
    - cron: "19 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-agents:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test offline coverage evidence handling
        run: python3 -m unittest discover -s java-agent/scripts/evidence -p 'test_*.py'
      - name: Test the probe registry
        run: python3 -m unittest discover -s java-agent/probes -p 'test_*.py'
      - name: Check the rule-case files against the catalogue and the uncovered list
        run: python3 -m unittest discover -s java-agent/scripts -p 'test_rule_cases.py'
      - name: Check that the backport lines differ only where recorded
        run: |
          set -euo pipefail
          python3 -m unittest discover -s java-agent/scripts -p 'test_check_backport_drift.py'
          python3 java-agent/scripts/check-backport-drift.py
      - name: Check detector false-positive-suppression parity
        working-directory: java-agent
        run: bash scripts/check-detector-parity.sh
      - name: Test and package every agent compatibility line
        run: |
          set -euo pipefail
          gradle_image="$(awk '$1 == "FROM" && $2 ~ /^gradle:/ { print $2; exit }' java-agent/Dockerfile)"
          test -n "$gradle_image"
          docker run --pull always --rm \
            -u "$(id -u):$(id -g)" \
            -e GRADLE_USER_HOME=/tmp/gradle-home \
            -v "$PWD/java-agent:/workspace" \
            -w /workspace \
            "$gradle_image" \
            gradle --no-daemon --no-problems-report clean check :stageYarnProbe :stageServletProbe :stageElasticLz4Probe :stageSpringProcessProbe :stageOpenWireProbe :stageHessianProbe :stageXmlRpcProbe :stageCollectionsProbe :stageHookTargets \
            :agent-jdk25:agentJar :agent-jdk25:jdk21Jars :agent-jdk25:stageC3p0Probe \
            :agent-java8:agentJava8Jar :agent-java11:agentJava11Jar :agent-java17:agentJava17Jar \
            :agent-all:agentAllJar :agent-all:shirudoUpatchJar \
            :agent-java8:shirudoUpatchJar \
            :agent-java11:shirudoUpatchJar \
            :agent-java17:shirudoUpatchJar \
            :agent-jdk25:shirudoUpatchJar \
            :playground:war \
            :playground-javax:war
      - name: Gate invokedynamic call sites in the backport agent JARs
        run: |
          set -euo pipefail
          python3 -m unittest discover -s java-agent/scripts -p 'test_check_dynamic_calls.py'
          python3 java-agent/scripts/check-dynamic-calls.py --check
      - name: Verify benign corpus and generated false-positive report
        working-directory: java-agent
        run: |
          set -euo pipefail
          gradle_image="$(awk '$1 == "FROM" && $2 ~ /^gradle:/ { print $2; exit }' Dockerfile)"
          docker run --rm --pull never --network none -v "$PWD:/workspace:ro" -w /workspace \
            "$gradle_image" java -cp agent-jdk25/build/libs/ohmyrasp-agent.jar \
            scripts/FpReport.java --check | diff -u docs/FALSE-POSITIVE-REPORT.md -
      - name: Inspect the Vulhub-version OpenWire constructor sites offline
        working-directory: java-agent
        run: |
          gradle_image="$(awk '$1 == "FROM" && $2 ~ /^gradle:/ { print $2; exit }' Dockerfile)"
          docker run --rm --pull never --network none -v "$PWD:/workspace:ro" -w /workspace \
            "$gradle_image" java -cp agent-java11/build/libs/ohmyrasp-agent-java11.jar \
            probes/openwire-throwable/OpenWireLayoutCheck.java build/openwire-probe/layout/*.jar
      - name: Verify Elasticsearch transport block isolation
        working-directory: java-agent
        run: |
          gradle_image="$(awk '$1 == "FROM" && $2 ~ /^gradle:/ { print $2; exit }' Dockerfile)"
          docker run --rm --pull never --network none --hostname localhost -v "$PWD:/workspace:ro" -w /workspace \
            "$gradle_image" python3 probes/run.py run --line jdk25 --isolated elastic-lz4
          docker run --rm --pull never --network none --hostname localhost -v "$PWD:/workspace:ro" -w /workspace \
            "$gradle_image" python3 probes/run.py run --line jdk25 --artifact all --isolated elastic-lz4
      - name: Stage and validate shirudo upatch packages
        run: |
          set -euo pipefail
          ./deploy/shirudo/stage-jars.sh
          ./deploy/shirudo/verify-shirudo-upatch.sh
      - name: Upload YARN fixture libraries
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: yarn-probe-libs
          path: java-agent/build/yarn-probe/*.jar
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
      - name: Upload hook-target library JARs
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: hook-target-libs
          path: java-agent/build/hook-targets
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
      - name: Stage fixture JARs for the runtime matrix
        run: python3 java-agent/probes/run.py stage
      - name: Upload agent compatibility artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: java-agents
          path: |
            java-agent/build/collections-probe/*.jar
            java-agent/build/hessian-probe/*.jar
            java-agent/build/openwire-probe/fixed/*.jar
            java-agent/build/spring-process-probe/**/*.jar
            java-agent/build/runtime-probes/*.jar
            java-agent/build/xmlrpc-probe/*.jar
            java-agent/build/servlet-probe/*.jar
            java-agent/agent-java8/build/libs/ohmyrasp-agent-java8.jar
            java-agent/agent-java11/build/libs/ohmyrasp-agent-java11.jar
            java-agent/agent-java17/build/libs/ohmyrasp-agent-java17.jar
            java-agent/agent-jdk25/build/libs/ohmyrasp-agent.jar
            java-agent/agent-jdk25/build/c3p0-probe/*.jar
            java-agent/agent-jdk25/build/jdk21/ohmyrasp-agent-jdk21.jar
            java-agent/agent-jdk25/build/jdk21/ohmyrasp-jdk21.jar
            java-agent/agent-java8/build/libs/ohmyrasp-java8.jar
            java-agent/agent-java11/build/libs/ohmyrasp-java11.jar
            java-agent/agent-java17/build/libs/ohmyrasp-java17.jar
            java-agent/agent-jdk25/build/libs/ohmyrasp-jdk25.jar
            java-agent/agent-all/build/libs/ohmyrasp-agent-all.jar
            java-agent/agent-all/build/libs/ohmyrasp.jar
          if-no-files-found: error
          retention-days: 1

      - name: Upload JDK 21 downloads
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ohmyrasp-jdk21
          path: dist/jdk21/
          if-no-files-found: error

  windows-file-streams:
    needs: build-agents
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: java-agent/probes
      - name: Download agent compatibility artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: java-agents
          path: java-agent
      - name: Install the primary JDK
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "25"
          check-latest: true
      - name: Run the probes that also apply on Windows
        run: python java-agent/probes/run.py run --line jdk25 --windows --keep-going

  runtime-compatibility:
    needs: build-agents
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - line: java8
            java: "8"
            jar: agent-java8/build/libs/ohmyrasp-agent-java8.jar
          - line: java11
            java: "11"
            jar: agent-java11/build/libs/ohmyrasp-agent-java11.jar
          - line: java17
            java: "17"
            jar: agent-java17/build/libs/ohmyrasp-agent-java17.jar
          - line: java17-on-21
            java: "21"
            jar: agent-java17/build/libs/ohmyrasp-agent-java17.jar
          - line: jdk21
            java: "21"
            jar: agent-jdk25/build/jdk21/ohmyrasp-agent-jdk21.jar
            upatch: agent-jdk25/build/jdk21/ohmyrasp-jdk21.jar
          - line: jdk25
            java: "25"
            jar: agent-jdk25/build/libs/ohmyrasp-agent.jar
            upatch: agent-jdk25/build/libs/ohmyrasp-jdk25.jar
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            java-agent/probes
            java-agent/rules/cases
            java-agent/playground/src/main/java/io/ohmyrasp/playground
      - name: Download agent compatibility artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: java-agents
          path: java-agent
      - name: Install latest Temurin ${{ matrix.java }}
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          check-latest: true
      - name: Start the agent on JDK ${{ matrix.java }}
        run: java -javaagent:"java-agent/${{ matrix.jar }}" -version
      - name: Download YARN fixture libraries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: yarn-probe-libs
          path: java-agent/build/yarn-probe
      - name: Download hook-target library JARs
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: hook-target-libs
          path: java-agent/build/hook-targets
      - name: Run every probe registered for ${{ matrix.line }}
        run: python3 java-agent/probes/run.py run --line "${{ matrix.line }}" --keep-going
      - name: Run the same probes against the universal JAR on JDK ${{ matrix.java }}
        run: python3 java-agent/probes/run.py run --line "${{ matrix.line }}" --artifact all --keep-going
      - name: Start the standalone agent on JDK ${{ matrix.java }}
        if: matrix.upatch
        run: java -javaagent:"java-agent/${{ matrix.upatch }}" -version
