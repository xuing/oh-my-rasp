name: agent

on:
  push:
    paths:
      - "java-agent/**"
      - "deploy/shirudo/**"
      - ".github/workflows/agent.yml"
  pull_request:
    paths:
      - "java-agent/**"
      - "deploy/shirudo/**"
      - ".github/workflows/agent.yml"
  schedule:
    # Re-resolve each JDK major every week so new CPU releases are tested even
    # when no source file changed.
    - cron: "19 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-agents:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Test offline coverage evidence handling
        run: python3 -m unittest discover -s java-agent/scripts/evidence -p 'test_*.py'
      - name: Check detector false-positive-suppression parity
        working-directory: java-agent
        run: bash scripts/check-detector-parity.sh
      - name: Test and package every agent compatibility line
        run: |
          set -euo pipefail
          gradle_image="$(awk '$1 == "FROM" && $2 ~ /^gradle:/ { print $2; exit }' java-agent/Dockerfile)"
          test -n "$gradle_image"
          docker run --pull always --rm \
            -u "$(id -u):$(id -g)" \
            -e GRADLE_USER_HOME=/tmp/gradle-home \
            -v "$PWD/java-agent:/workspace" \
            -w /workspace \
            "$gradle_image" \
            gradle --no-daemon --no-problems-report clean check :stageYarnProbe :stageServletProbe :stageElasticLz4Probe \
            :agent-jdk25:jdk21Jars \
            :agent-java8:shirudoUpatchJar \
            :agent-java11:shirudoUpatchJar \
            :agent-java17:shirudoUpatchJar \
            :agent-jdk25:shirudoUpatchJar \
            :playground:war \
            :playground-javax:war
      - name: Verify benign corpus and generated false-positive report
        working-directory: java-agent
        run: |
          set -euo pipefail
          gradle_image="$(awk '$1 == "FROM" && $2 ~ /^gradle:/ { print $2; exit }' Dockerfile)"
          docker run --rm --pull never --network none -v "$PWD:/workspace:ro" -w /workspace \
            "$gradle_image" java -cp agent-jdk25/build/libs/ohmyrasp-agent.jar \
            scripts/fp-harness/FpReport.java --check | diff -u docs/FALSE-POSITIVE-REPORT.md -
      - name: Verify Elasticsearch transport block isolation
        working-directory: java-agent
        run: |
          gradle_image="$(awk '$1 == "FROM" && $2 ~ /^gradle:/ { print $2; exit }' Dockerfile)"
          docker run --rm --pull never --network none --hostname localhost -v "$PWD:/workspace:ro" -w /workspace \
            "$gradle_image" python3 scripts/fp-harness/check-elastic-lz4.py \
            agent-jdk25/build/libs/ohmyrasp-agent.jar --jar-dir build/elastic-lz4-probe
      - name: Stage and validate shirudo upatch packages
        run: |
          set -euo pipefail
          ./deploy/shirudo/stage-jars.sh
          ./deploy/shirudo/verify-shirudo-upatch.sh
      - name: Upload YARN fixture libraries
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: yarn-probe-libs
          path: java-agent/build/yarn-probe/*.jar
          if-no-files-found: error
          compression-level: 0
          retention-days: 1
      - name: Upload agent compatibility artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: java-agents
          path: |
            java-agent/build/servlet-probe/*.jar
            java-agent/agent-java8/build/libs/ohmyrasp-agent-java8.jar
            java-agent/agent-java11/build/libs/ohmyrasp-agent-java11.jar
            java-agent/agent-java17/build/libs/ohmyrasp-agent-java17.jar
            java-agent/agent-jdk25/build/libs/ohmyrasp-agent.jar
            java-agent/agent-jdk25/build/jdk21/ohmyrasp-agent-jdk21.jar
            java-agent/agent-jdk25/build/jdk21/ohmyrasp-jdk21.jar
            java-agent/agent-java8/build/libs/ohmyrasp-java8.jar
            java-agent/agent-java11/build/libs/ohmyrasp-java11.jar
            java-agent/agent-java17/build/libs/ohmyrasp-java17.jar
            java-agent/agent-jdk25/build/libs/ohmyrasp-jdk25.jar
          if-no-files-found: error
          retention-days: 1

      - name: Upload JDK 21 downloads
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ohmyrasp-jdk21
          path: dist/jdk21/
          if-no-files-found: error

  windows-file-streams:
    needs: build-agents
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: java-agent/scripts/fp-harness
      - name: Download agent compatibility artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: java-agents
          path: java-agent
      - name: Install the primary JDK
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: "25"
          check-latest: true
      - name: Check NTFS stream writes and file contents
        run: python java-agent/scripts/fp-harness/check-file-streams.py java-agent/agent-jdk25/build/libs/ohmyrasp-agent.jar

  runtime-compatibility:
    needs: build-agents
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - java: "8"
            jar: agent-java8/build/libs/ohmyrasp-agent-java8.jar
          - java: "11"
            jar: agent-java11/build/libs/ohmyrasp-agent-java11.jar
          - java: "17"
            jar: agent-java17/build/libs/ohmyrasp-agent-java17.jar
          - java: "21"
            jar: agent-java17/build/libs/ohmyrasp-agent-java17.jar
          - java: "21"
            jar: agent-jdk25/build/jdk21/ohmyrasp-agent-jdk21.jar
            upatch: agent-jdk25/build/jdk21/ohmyrasp-jdk21.jar
          - java: "25"
            jar: agent-jdk25/build/libs/ohmyrasp-agent.jar
            upatch: agent-jdk25/build/libs/ohmyrasp-jdk25.jar
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          sparse-checkout: |
            java-agent/scripts/fp-harness
            java-agent/playground/src/main/java/io/ohmyrasp/playground
      - name: Download agent compatibility artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: java-agents
          path: java-agent
      - name: Install latest Temurin ${{ matrix.java }}
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          check-latest: true
      - name: Start the agent on JDK ${{ matrix.java }}
        run: java -javaagent:"java-agent/${{ matrix.jar }}" -version
      - name: Check a background pipeline in block mode
        run: |
          set -euo pipefail
          probe="$(mktemp -d)"
          javac -d "$probe" java-agent/scripts/fp-harness/BackgroundProcessCheck.java
          touch "$probe/events.jsonl"
          java -Dohmyrasp.standalone=true -Dohmyrasp.mode=block -Dohmyrasp.control=none \
            -Dohmyrasp.log="$probe/events.jsonl" -Dohmyrasp.log.sync=true \
            -javaagent:"java-agent/${{ matrix.jar }}" -cp "$probe" BackgroundProcessCheck \
            > "$probe/console.log" 2>&1 || { cat "$probe/console.log"; exit 1; }
          python3 - "$probe" <<'PY'
          import json, sys
          from pathlib import Path
          probe = Path(sys.argv[1])
          events = [json.loads(line) for line in (probe / "events.jsonl").read_text().splitlines()]
          started = any(e.get("event", "").endswith("-agent-start") for e in events)
          if not started and "[OHMYRASP] agent started with ASM transformer" not in (probe / "console.log").read_text():
              sys.exit("Agent startup record missing")
          if any(e.get("kind") == "detection" or e.get("event") == "ohmyrasp-detection" for e in events):
              sys.exit("Ordinary background job produced a detection")
          PY
      - name: Verify HTTP acquisition, redirect and asynchronous request attribution
        run: python3 java-agent/scripts/fp-harness/check-http-transport.py "java-agent/${{ matrix.jar }}"
      - name: Verify validated process arguments and pipeline stages
        run: python3 java-agent/scripts/fp-harness/check-process-launch.py "java-agent/${{ matrix.jar }}"
      - name: Verify Javax and Jakarta multipart authorization
        run: python3 java-agent/scripts/fp-harness/check-multipart-archive.py "java-agent/${{ matrix.jar }}" --api-dir java-agent/build/servlet-probe
      - name: Check literal stream-like names on Linux
        if: startsWith(matrix.jar, 'agent-jdk25/')
        run: python3 java-agent/scripts/fp-harness/check-file-streams.py "java-agent/${{ matrix.jar }}"
      - name: Verify ZIP and host write destinations
        run: python3 java-agent/scripts/fp-harness/check-write-namespace.py "java-agent/${{ matrix.jar }}"
      - name: Verify host filesystem read decisions
        run: python3 java-agent/scripts/fp-harness/check-file-read.py "java-agent/${{ matrix.jar }}"
      - name: Verify report identifiers against an in-memory SQLite database
        if: matrix.java == '25'
        run: python3 java-agent/scripts/fp-harness/check-sqlite-identifiers.py "java-agent/${{ matrix.jar }}"
      - name: Verify MyBatis template and JDBC handoff
        run: python3 java-agent/scripts/fp-harness/check-mybatis-mapping.py "java-agent/${{ matrix.jar }}"
      - name: Verify plot output stream ownership
        if: startsWith(matrix.jar, 'agent-java')
        run: python3 java-agent/scripts/fp-harness/check-plot-stream.py "java-agent/${{ matrix.jar }}"
      - name: Download YARN fixture libraries
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: yarn-probe-libs
          path: ${{ runner.temp }}/yarn-probe
      - name: Verify YARN admission with a recording client
        run: python3 java-agent/scripts/fp-harness/check-yarn-submit.py "java-agent/${{ matrix.jar }}" --jar-dir "$RUNNER_TEMP/yarn-probe"
      - name: Verify Spark submit role at servlet dispatch
        run: python3 java-agent/scripts/fp-harness/check-spark-submit.py "java-agent/${{ matrix.jar }}" --api-dir java-agent/build/servlet-probe
      - name: Verify resolved serialization classes and proxy interfaces
        run: python3 java-agent/scripts/fp-harness/check-stream-resolution.py "java-agent/${{ matrix.jar }}"
      - name: Verify JVM and per-stream deserialization filters
        if: startsWith(matrix.jar, 'agent-jdk25/')
        run: python3 java-agent/scripts/fp-harness/check-serial-filter.py "java-agent/${{ matrix.jar }}"
      - name: Verify authentication rejection and downstream filter dispatch
        run: python3 java-agent/scripts/fp-harness/check-jwt-verification.py "java-agent/${{ matrix.jar }}" --api-dir java-agent/build/servlet-probe
      - name: Verify resolved JMX dispatch
        run: python3 java-agent/scripts/fp-harness/check-jmx-dispatch.py "java-agent/${{ matrix.jar }}"
      - name: Verify XML catalogue and transport decisions
        run: python3 java-agent/scripts/fp-harness/check-xml-resolution.py "java-agent/${{ matrix.jar }}"
      - name: Start the standalone agent on JDK ${{ matrix.java }}
        if: matrix.upatch
        run: java -javaagent:"java-agent/${{ matrix.upatch }}" -version
