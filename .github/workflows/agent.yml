name: agent

on:
  push:
    paths:
      - "java-agent/**"
      - "deploy/shirudo/**"
      - ".github/workflows/agent.yml"
  pull_request:
    paths:
      - "java-agent/**"
      - "deploy/shirudo/**"
      - ".github/workflows/agent.yml"
  schedule:
    # Re-resolve each JDK major every week so new CPU releases are tested even
    # when no source file changed.
    - cron: "19 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build-agents:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Check detector false-positive-suppression parity
        working-directory: java-agent
        run: bash scripts/check-detector-parity.sh
      - name: Test and package every agent compatibility line
        run: |
          set -euo pipefail
          gradle_image="$(awk '$1 == "FROM" && $2 ~ /^gradle:/ { print $2; exit }' java-agent/Dockerfile)"
          test -n "$gradle_image"
          docker run --pull always --rm \
            -u "$(id -u):$(id -g)" \
            -e GRADLE_USER_HOME=/tmp/gradle-home \
            -v "$PWD/java-agent:/workspace" \
            -w /workspace \
            "$gradle_image" \
            gradle --no-daemon --no-problems-report clean check \
            :agent-jdk25:jdk21Jars \
            :agent-java8:shirudoUpatchJar \
            :agent-java11:shirudoUpatchJar \
            :agent-java17:shirudoUpatchJar \
            :agent-jdk25:shirudoUpatchJar \
            :playground:war \
            :playground-javax:war
      - name: Verify benign corpus and generated false-positive report
        working-directory: java-agent
        run: |
          set -euo pipefail
          gradle_image="$(awk '$1 == "FROM" && $2 ~ /^gradle:/ { print $2; exit }' Dockerfile)"
          docker run --rm --pull never --network none -v "$PWD:/workspace:ro" -w /workspace \
            "$gradle_image" java -cp agent-jdk25/build/libs/ohmyrasp-agent.jar \
            scripts/fp-harness/FpReport.java --check | diff -u docs/FALSE-POSITIVE-REPORT.md -
      - name: Stage and validate shirudo upatch packages
        run: |
          set -euo pipefail
          ./deploy/shirudo/stage-jars.sh
          ./deploy/shirudo/verify-shirudo-upatch.sh
      - name: Upload agent compatibility artifacts
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: java-agents
          path: |
            java-agent/agent-java8/build/libs/ohmyrasp-agent-java8.jar
            java-agent/agent-java11/build/libs/ohmyrasp-agent-java11.jar
            java-agent/agent-java17/build/libs/ohmyrasp-agent-java17.jar
            java-agent/agent-jdk25/build/libs/ohmyrasp-agent.jar
            java-agent/agent-jdk25/build/jdk21/ohmyrasp-agent-jdk21.jar
            java-agent/agent-jdk25/build/jdk21/ohmyrasp-jdk21.jar
            java-agent/agent-java8/build/libs/ohmyrasp-java8.jar
            java-agent/agent-java11/build/libs/ohmyrasp-java11.jar
            java-agent/agent-java17/build/libs/ohmyrasp-java17.jar
            java-agent/agent-jdk25/build/libs/ohmyrasp-jdk25.jar
          if-no-files-found: error
          retention-days: 1

      - name: Upload JDK 21 downloads
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: ohmyrasp-jdk21
          path: dist/jdk21/
          if-no-files-found: error

  runtime-compatibility:
    needs: build-agents
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - java: "8"
            jar: agent-java8/build/libs/ohmyrasp-agent-java8.jar
          - java: "11"
            jar: agent-java11/build/libs/ohmyrasp-agent-java11.jar
          - java: "17"
            jar: agent-java17/build/libs/ohmyrasp-agent-java17.jar
          - java: "21"
            jar: agent-java17/build/libs/ohmyrasp-agent-java17.jar
          - java: "21"
            jar: agent-jdk25/build/jdk21/ohmyrasp-agent-jdk21.jar
            upatch: agent-jdk25/build/jdk21/ohmyrasp-jdk21.jar
          - java: "25"
            jar: agent-jdk25/build/libs/ohmyrasp-agent.jar
            upatch: agent-jdk25/build/libs/ohmyrasp-jdk25.jar
    steps:
      - name: Download agent compatibility artifacts
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: java-agents
          path: java-agent
      - name: Install latest Temurin ${{ matrix.java }}
        uses: actions/setup-java@d1374f8ac74474200d16ef8ecee22c7ae7a51880 # v6.3.0
        with:
          distribution: temurin
          java-version: ${{ matrix.java }}
          check-latest: true
      - name: Start the agent on JDK ${{ matrix.java }}
        run: java -javaagent:"java-agent/${{ matrix.jar }}" -version
      - name: Start the standalone agent on JDK ${{ matrix.java }}
        if: matrix.upatch
        run: java -javaagent:"java-agent/${{ matrix.upatch }}" -version
