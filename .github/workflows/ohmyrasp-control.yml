name: ohmyrasp-control

on:
  push:
    paths:
      - "api/**"
      - "console/**"
      - "deploy/**"
      - "docker-compose.yml"
      - ".github/docker-compose.ci-services.yml"
      - ".github/workflows/ohmyrasp-control.yml"
      - ".github/workflows/ohmyrasp-release.yml"
  pull_request:
    paths:
      - "api/**"
      - "console/**"
      - "deploy/**"
      - "docker-compose.yml"
      - ".github/docker-compose.ci-services.yml"
      - ".github/workflows/ohmyrasp-control.yml"
      - ".github/workflows/ohmyrasp-release.yml"
  schedule:
    - cron: "53 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  backend:
    runs-on: ubuntu-latest
    env:
      OHMYRASP_POSTGRES_TEST_DSN: postgres://ohmyrasp:ohmyrasp@localhost:55432/ohmyrasp?sslmode=disable
      OHMYRASP_CLICKHOUSE_TEST_DSN: clickhouse://ohmyrasp:ohmyrasp@localhost:59000?database=default
      OHMYRASP_VALKEY_TEST_ADDR: localhost:56379
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-go@b7ad1dad31e06c5925ef5d2fc7ad053ef454303e # v7.0.0
        with:
          go-version: stable
          check-latest: true
          cache-dependency-path: api/go.sum
      - name: Start integration-test services
        run: docker compose -f .github/docker-compose.ci-services.yml up -d --wait
      - name: Run API tests
        working-directory: api
        run: go test ./...
      - name: Dump integration-service logs
        if: failure()
        run: docker compose -f .github/docker-compose.ci-services.yml logs --no-color
      - name: Stop integration-test services
        if: always()
        run: docker compose -f .github/docker-compose.ci-services.yml down -v

  console:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: console
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: node
          check-latest: true
          cache: npm
          cache-dependency-path: console/package-lock.json
      - run: npm ci
      - run: npm run build
      - run: npx playwright install --with-deps chromium
      - run: npm test

  helm-manifests:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - name: Validate rendered Helm manifests
        run: deploy/scripts/validate-helm-manifests.sh
      - name: Validate observability assets
        run: deploy/scripts/validate-observability-assets.sh

  compose-smoke:
    runs-on: ubuntu-latest
    needs:
      - backend
      - console
      - helm-manifests
    env:
      API_PORT: "18090"
      WEB_PORT: "18091"
      POSTGRES_PORT: "15432"
      CLICKHOUSE_HTTP_PORT: "18123"
      CLICKHOUSE_NATIVE_PORT: "19000"
      VALKEY_PORT: "16379"
      PROMETHEUS_PORT: "19090"
      ALERTMANAGER_PORT: "19093"
      GRAFANA_PORT: "13000"
      POSTGRES_USER: ohmyrasp
      POSTGRES_PASSWORD: ohmyrasp-ci-postgres
      POSTGRES_DB: ohmyrasp
      CLICKHOUSE_USER: ohmyrasp
      CLICKHOUSE_PASSWORD: ohmyrasp-ci-clickhouse
      CLICKHOUSE_DB: ohmyrasp
      VALKEY_PASSWORD: ohmyrasp-ci-valkey
      GRAFANA_ADMIN_PASSWORD: ohmyrasp-ci-grafana
      OHMYRASP_API_ADDR: 0.0.0.0:8080
      OHMYRASP_BOOTSTRAP_ADMIN_EMAIL: admin@ohmyrasp.local
      OHMYRASP_BOOTSTRAP_ADMIN_PASSWORD: ohmyrasp-ci-admin
      OHMYRASP_BOOTSTRAP_ADMIN_NAME: CI Admin
      OHMYRASP_BOOTSTRAP_APP_SECRET: ohmyrasp-ci-app-secret
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: node
          check-latest: true
          cache: npm
          cache-dependency-path: console/package-lock.json
      - name: Install console test dependencies
        working-directory: console
        run: npm ci
      - name: Install Playwright browser
        working-directory: console
        run: npx playwright install --with-deps chromium
      - name: Start Compose stack
        run: docker compose -f docker-compose.yml up -d --build
      - name: Run API smoke test
        run: deploy/scripts/smoke-control-plane.sh
      - name: Run live browser smoke test
        working-directory: console
        env:
          OHMYRASP_E2E_LIVE_URL: http://127.0.0.1:18091
        run: npm run test:e2e:live
      - name: Dump Compose logs
        if: failure()
        run: docker compose -f docker-compose.yml logs --no-color api web migrate postgres clickhouse valkey prometheus alertmanager grafana
      - name: Stop Compose stack
        if: always()
        run: docker compose -f docker-compose.yml down -v
