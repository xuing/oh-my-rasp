services:
  postgres:
    image: postgres:18.6
    environment:
      POSTGRES_USER: ohmyrasp
      POSTGRES_PASSWORD: ohmyrasp
      POSTGRES_DB: ohmyrasp
    ports:
      - "55432:5432"
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U ohmyrasp -d ohmyrasp"]
      interval: 5s
      timeout: 3s
      retries: 20

  clickhouse:
    image: clickhouse/clickhouse-server:26.9.16.11
    environment:
      CLICKHOUSE_DB: default
      CLICKHOUSE_USER: ohmyrasp
      CLICKHOUSE_PASSWORD: ohmyrasp
    ports:
      - "59000:9000"
    healthcheck:
      test: [CMD-SHELL, "clickhouse-client --user ohmyrasp --password ohmyrasp --query 'SELECT 1'"]
      interval: 5s
      timeout: 3s
      retries: 30

  valkey:
    image: valkey/valkey:9.1.2
    ports:
      - "56379:6379"
    healthcheck:
      test: [CMD, valkey-cli, ping]
      interval: 5s
      timeout: 3s
      retries: 20
