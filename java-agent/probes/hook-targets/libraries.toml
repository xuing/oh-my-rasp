# Third-party libraries the agents hook, and the versions the hook map is recorded against.
#
# One [[library]] per Maven coordinate. `versions` should span what is deployed: the oldest still
# common, one where the API changed, the newest. `why` says why those versions.
# `none` lists versions that carry no hook, each with its reason: the library removed or renamed what
# the hook matches. Every other version must have at least one hooked method on some agent line. A
# reason that starts with FINDING is a hook that should be fixed, recorded here so the probe passes
# until it is.
#
# Keep `group`, `artifact` and `versions` on one line each: java-agent/build.gradle.kts reads them
# with a line parser to stage the JARs (task stageHookTargets). check.py and test_hook_targets.py
# read the whole file with tomllib.
#
# Left out on purpose, because the agents match them by interface or by name prefix and no hook names
# one of their classes: JDBC drivers and pools (mysql-connector, postgresql, mariadb, sqlite-jdbc,
# hsqldb, derby, ojdbc, mssql-jdbc, HikariCP, dbcp, tomcat-jdbc), JSR-223 engines (*ScriptEngineImpl),
# and servlet containers beyond the classes named below. H2 is here because the backport JDBC
# transformer names org.h2.jdbc.JdbcConnection.
#
# Coordinates that could not be staged from Maven Central:
#   org.apache.commons:commons-ognl     no release on Maven Central.
#   it.geosolutions.jaiext.jiffle:jt-jiffle-language   not on Maven Central (GeoSolutions repository only).
#   org.jboss.el:jboss-el               not on Maven Central; the albfernandez fork below stands in for it.
#   io.dataease CommunityTokenFilter    an application class of DataEase, not a library.
#   jdk.nashorn.api.scripting.NashornScriptEngine   part of JDK 8-14.

