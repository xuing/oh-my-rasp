        TOMCAT_IMAGE: tomcat:9.0-jdk17-temurin
        PLAYGROUND_PROJECT: playground-java17
    image: ohmyrasp/playground:tomcat9-java17
    ports:
      - "${OHMYRASP_TOMCAT9_JAVA17_BASELINE_PORT:-18134}:8080"
    environment:
      OHMYRASP_ENV: tomcat9-java17-baseline
    volumes:
      - ./logs/tomcat9-java17-baseline:/opt/ohmyrasp/logs
    extra_hosts: *extra-hosts

  tomcat9-java17-protected:
    image: ohmyrasp/playground:tomcat9-java17
    depends_on:
      - tomcat9-java17-baseline
    ports:
      - "${OHMYRASP_TOMCAT9_JAVA17_PROTECTED_PORT:-18135}:8080"
    environment:
      OHMYRASP_ENV: tomcat9-java17-protected
      OHMYRASP_HOSTNAME: tomcat9-java17-protected
