      - "${OHMYRASP_TOMCAT10_JAVA17_BASELINE_PORT:-18132}:8080"
    environment:
      OHMYRASP_ENV: tomcat10-java17-baseline
    volumes:
      - ./logs/tomcat10-java17-baseline:/opt/ohmyrasp/logs
    extra_hosts: *extra-hosts

  tomcat10-java17-protected:
