name: ohmyrasp-java17-agent

x-extra-hosts: &extra-hosts
  - "host.docker.internal:host-gateway"

services:
  tomcat11-java17-baseline:
    build:
      context: .
      dockerfile: Dockerfile.java17
      pull: true
      args:
        TOMCAT_IMAGE: tomcat:11.0-jdk17-temurin
        PLAYGROUND_PROJECT: playground-java17-jakarta
    image: ohmyrasp/playground:tomcat11-java17
    ports:
      - "${OHMYRASP_TOMCAT11_JAVA17_BASELINE_PORT:-18130}:8080"
    environment:
      OHMYRASP_ENV: tomcat11-java17-baseline
    volumes:
      - ./logs/tomcat11-java17-baseline:/opt/ohmyrasp/logs
    extra_hosts: *extra-hosts

  tomcat11-java17-protected:
    image: ohmyrasp/playground:tomcat11-java17
    depends_on:
      - tomcat11-java17-baseline
    ports:
      - "${OHMYRASP_TOMCAT11_JAVA17_PROTECTED_PORT:-18131}:8080"
    environment:
      OHMYRASP_ENV: tomcat11-java17-protected
      OHMYRASP_HOSTNAME: tomcat11-java17-protected
      OHMYRASP_LOG: /opt/ohmyrasp/logs/events.jsonl
      CATALINA_OPTS: >-
        -javaagent:/opt/ohmyrasp/ohmyrasp-agent-java17.jar
        -Dohmyrasp.java17.log=/opt/ohmyrasp/logs/events.jsonl
        -Dohmyrasp.java17.block=true
        -Dohmyrasp.debug=${OHMYRASP_AGENT_DEBUG:-false}
    volumes:
      - ./logs/tomcat11-java17-protected:/opt/ohmyrasp/logs
    extra_hosts: *extra-hosts

  tomcat10-java17-baseline:
    build:
      context: .
      dockerfile: Dockerfile.java17
