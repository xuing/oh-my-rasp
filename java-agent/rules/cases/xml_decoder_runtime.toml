[[case]]
name = "process-builder-outside-request"
kind = "attack"
via = "sink"
op = "beans.decode"
args = { document = "<?xml version=\"1.0\"?><java><object class=\"java.lang.ProcessBuilder\"><array class=\"java.lang.String\" length=\"2\"><void index=\"0\"><string>echo</string></void><void index=\"1\"><string>rule-case</string></void></array><void method=\"start\"/></object></java>" }

[case.primary]
effect = "none"
why = "the primary decides XMLDecoder statements only inside an HTTP request"

[case.backport]
