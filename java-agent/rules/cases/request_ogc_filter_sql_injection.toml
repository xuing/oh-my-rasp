[[case]]
name = "cql-filter-cast-select"
kind = "attack"
via = "request"

[case.request]
method = "GET"
uri = "/geoserver/ows"
query = "service=wfs&version=1.0.0&request=GetFeature&typeName=vulhub:example&CQL_FILTER=strStartsWith%28name%2C%27x%27%27%29+%3D+true+and+1%3D%28SELECT+CAST+%28%28SELECT+version%28%29%29+AS+integer%29%29+--+%27%29+%3D+true"
headers = { User-Agent = "Mozilla/5.0 (X11; Linux x86_64) Firefox/128.0", Accept = "text/html" }

[case.primary]
effect = "block"
rule = "request_ogc_filter_sql_injection"

[case.backport]
effect = "block"
rule = "request_ogc_filter_sql_injection"

[[case]]
name = "benign-cql-filter"
kind = "benign"
via = "request"

[case.request]
method = "GET"
uri = "/geoserver/ows"
query = "service=wfs&request=GetFeature&CQL_FILTER=strStartsWith%28name%2C%27x%27%29"
headers = { User-Agent = "Mozilla/5.0 (X11; Linux x86_64) Firefox/128.0", Accept = "text/html" }

[case.primary]
effect = "none"

[case.backport]
effect = "none"
