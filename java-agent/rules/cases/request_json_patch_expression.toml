[[case]]
name = "json-patch-path-expression-via-input-stream"
kind = "attack"
via = "request"

[case.request]
method = "PATCH"
uri = "/customers/1"
headers = { User-Agent = "Mozilla/5.0 (X11; Linux x86_64) Firefox/128.0", "Content-Type" = "application/json-patch+json" }
body = "[{\"op\":\"replace\",\"path\":\"T(java.lang.Runtime).getRuntime().exec(new java.lang.String(new byte[]{105,100}))/lastname\",\"value\":\"vulhub\"}]"
body_api = "stream"

[case.primary]
effect = "block"
rule = "request_json_patch_expression"

[case.backport]
effect = "none"
why = "the agent's request context has no body (no hook reads the input stream or the reader), so a rule decided from the body alone cannot fire"

