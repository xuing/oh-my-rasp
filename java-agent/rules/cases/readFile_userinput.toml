[[case]]
name = "request-selects-hosts"
kind = "attack"
via = "request-sink"
op = "file.read"
args = { path = "/etc/hosts" }

[case.request]
method = "GET"
uri = "/app/download"
query = "file=%2Fetc%2Fhosts"
headers = { User-Agent = "Mozilla/5.0 (X11; Linux x86_64) Firefox/128.0", Accept = "text/html" }

[case.primary]
effect = "block"
rule = "readFile_userinput"

[case.backport]
effect = "block"
rule = "file_sensitive_read"

[[case]]
name = "request-traversal-to-hosts"
kind = "attack"
via = "request-sink"
op = "file.read"
args = { path = "{tmp}/files/../../../../../../../../../etc/hosts" }
setup = { files = ["{tmp}/files/weekly.txt"] }

[case.request]
method = "GET"
uri = "/app/download"
query = "file=..%2F..%2F..%2F..%2F..%2F..%2F..%2F..%2F..%2Fetc%2Fhosts"
headers = { User-Agent = "Mozilla/5.0 (X11; Linux x86_64) Firefox/128.0", Accept = "text/html" }

[case.primary]
effect = "block"
rule = "readFile_userinput"

[case.backport]
effect = "block"
rule = "file_sensitive_read"

[[case]]
name = "benign-hosts-read-outside-request"
kind = "benign"
via = "sink"
op = "file.read"
args = { path = "/etc/hosts" }

[case.primary]
effect = "none"

[case.backport]
effect = "none"

[[case]]
name = "benign-request-selects-report"
kind = "benign"
via = "request-sink"
op = "file.read"
args = { path = "{tmp}/files/weekly.txt" }
setup = { files = ["{tmp}/files/weekly.txt"] }

[case.request]
method = "GET"
uri = "/app/download"
query = "file=weekly.txt"
headers = { User-Agent = "Mozilla/5.0 (X11; Linux x86_64) Firefox/128.0", Accept = "text/html" }

[case.primary]
effect = "none"

[case.backport]
effect = "none"
