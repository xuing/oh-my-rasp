[[case]]
name = "constant-disjunction-in-request"
kind = "attack"
via = "request-sink"
op = "sql.execute"
args = { sql = "SELECT * FROM users WHERE id = 7 OR 1=1" }

[case.request]
method = "GET"
uri = "/app/report"
query = "id=7"
headers = { User-Agent = "Mozilla/5.0 (X11; Linux x86_64) Firefox/128.0", Accept = "text/html" }

[case.primary]
effect = "block"
rule = "sql_policy"

[case.backport]
effect = "block"
rule = "sql_statement_injection"

[[case]]
name = "constant-disjunction-outside-request"
kind = "attack"
via = "sink"
op = "sql.execute"
args = { sql = "SELECT * FROM users WHERE id = 7 OR 1=1" }

[case.primary]
effect = "block"
rule = "sql_policy"

[case.backport]
effect = "block"
rule = "sql_statement_injection"

[[case]]
name = "constant-disjunction-outside-request-log-only"
kind = "attack"
via = "sink"
op = "sql.execute"
args = { sql = "SELECT * FROM users WHERE id = 7 OR 1=1" }
control = { outside_request = "log" }

[case.primary]
effect = "log"
rule = "sql_policy"
why = "outside_request is log: SQL structure is context-dependent (a report or migration runs such statements on purpose), so outside a request the finding is logged and the statement runs."

[case.backport]
effect = "log"
rule = "sql_statement_injection"
why = "outside_request is log: SQL structure is context-dependent (a report or migration runs such statements on purpose), so outside a request the finding is logged and the statement runs."

[[case]]
name = "benign-in-request"
kind = "benign"
via = "request-sink"
op = "sql.execute"
args = { sql = "SELECT * FROM users WHERE id = 7" }

[case.request]
method = "GET"
uri = "/app/report"
query = "id=7"
headers = { User-Agent = "Mozilla/5.0 (X11; Linux x86_64) Firefox/128.0", Accept = "text/html" }

[case.primary]
effect = "none"

[case.backport]
effect = "none"
