[[case]]
name = "velocity-template-runtime"
kind = "attack"
via = "request"

[case.request]
method = "GET"
uri = "/solr/demo/select"
query = "q=1&wt=velocity&v.template=custom&v.template.custom=%23set(%24x%3D%27%27)%20%23set(%24rt%3D%24x.class.forName(%27java.lang.Runtime%27))%20%23set(%24ex%3D%24rt.getRuntime().exec(%27id%27))"
headers = { User-Agent = "Mozilla/5.0 (X11; Linux x86_64) Firefox/128.0", Accept = "text/html" }

[case.primary]
effect = "block"
rule = "request_template_parameter"

[case.backport]
effect = "unreachable"
why = "the backports have no request-entry rule for this input"

[[case]]
name = "benign-velocity-template"
kind = "benign"
via = "request"

[case.request]
method = "GET"
uri = "/solr/demo/select"
query = "q=1&wt=velocity&v.template=custom&v.template.custom=%23set(%24title%3D%27hello%27)%24title"
headers = { User-Agent = "Mozilla/5.0 (X11; Linux x86_64) Firefox/128.0", Accept = "text/html" }

[case.primary]
effect = "none"

[case.backport]
effect = "none"

[[case]]
name = "velocity-template-runtime-in-json-body"
kind = "attack"
via = "request"

[case.request]
method = "POST"
uri = "/solr/demo/select"
headers = { "User-Agent" = "Mozilla/5.0 (X11; Linux x86_64) Firefox/128.0", Accept = "text/html", "Content-Type" = "application/json" }
body = "{\"username\":\"a\",\"password\":\"hunter2-Secret\",\"q\":\"1\",\"wt\":\"velocity\",\"v.template\":\"custom\",\"v.template.custom\":\"#set($x='') #set($rt=$x.class.forName('java.lang.Runtime')) #set($ex=$rt.getRuntime().exec('id'))\"}"
body_api = "stream"

[case.primary]
effect = "block"
rule = "request_template_parameter"

[case.backport]
effect = "unreachable"
why = "the backports have no request-entry rule for this input"
