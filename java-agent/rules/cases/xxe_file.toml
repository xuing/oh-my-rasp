[[case]]
name = "passwd-entity-outside-request"
kind = "attack"
via = "sink"
op = "xml.parse"
args = { document = "<?xml version=\"1.0\"?><!DOCTYPE r [<!ENTITY x SYSTEM \"file:///etc/passwd\">]><r>&x;</r>" }

[case.primary]
effect = "log"
rule = "xxe_file"
also = ["xxe_protocol"]
why = "the primary blocks this only inside an HTTP request; outside one it logs"

[case.backport]
effect = "block"
rule = "xxe_external_entity_protocol"

[[case]]
name = "passwd-entity-in-request"
kind = "attack"
via = "request-sink"
op = "xml.parse"
args = { document = "<?xml version=\"1.0\"?><!DOCTYPE r [<!ENTITY x SYSTEM \"file:///etc/passwd\">]><r>&x;</r>" }

[case.request]
method = "GET"
uri = "/app/report"
query = "id=7"
headers = { User-Agent = "Mozilla/5.0 (X11; Linux x86_64) Firefox/128.0", Accept = "text/html" }

[case.primary]
effect = "block"
rule = "xxe_protocol"

[case.backport]
effect = "block"
rule = "xxe_external_entity_protocol"

[[case]]
name = "benign-internal-entity"
kind = "benign"
via = "sink"
op = "xml.parse"
args = { document = "<?xml version=\"1.0\"?><!DOCTYPE r [<!ENTITY x \"weekly\">]><r>&x;</r>" }

[case.primary]
effect = "none"

[case.backport]
effect = "none"
