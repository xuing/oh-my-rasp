[[case]]
name = "setup-complete-false"
kind = "attack"
via = "request"

[case.request]
method = "GET"
uri = "/server-info.action"
query = "bootstrapStatusProvider.applicationConfig.setupComplete=false"
headers = { User-Agent = "Mozilla/5.0 (X11; Linux x86_64) Firefox/128.0", Accept = "text/html" }

[case.primary]
effect = "block"
rule = "request_setup_state_reset"

[case.backport]
effect = "unreachable"
why = "the backports have no request-entry rule for this input"

[[case]]
name = "benign-setup-complete-true"
kind = "benign"
via = "request"

[case.request]
method = "GET"
uri = "/server-info.action"
query = "bootstrapStatusProvider.applicationConfig.setupComplete=true"
headers = { User-Agent = "Mozilla/5.0 (X11; Linux x86_64) Firefox/128.0", Accept = "text/html" }

[case.primary]
effect = "none"

[case.backport]
effect = "none"
