[[case]]
name = "velocity-loader-enable-parameter"
kind = "attack"
via = "request"

[case.request]
method = "POST"
uri = "/solr/demo/config"
query = "config=%7B%22update-queryresponsewriter%22%3A%7B%22name%22%3A%22velocity%22%2C%22class%22%3A%22solr.VelocityResponseWriter%22%2C%22params.resource.loader.enabled%22%3A%22true%22%7D%7D"
headers = { User-Agent = "Mozilla/5.0 (X11; Linux x86_64) Firefox/128.0", Accept = "text/html" }

[case.primary]
effect = "block"
rule = "request_template_loader_enable"

[case.backport]
effect = "unreachable"
why = "the backports have no request-entry rule for this input"

[[case]]
name = "benign-velocity-writer-parameter"
kind = "benign"
via = "request"

[case.request]
method = "POST"
uri = "/solr/demo/config"
query = "config=%7B%22update-queryresponsewriter%22%3A%7B%22name%22%3A%22velocity%22%2C%22class%22%3A%22solr.VelocityResponseWriter%22%7D%7D"
headers = { User-Agent = "Mozilla/5.0 (X11; Linux x86_64) Firefox/128.0", Accept = "text/html" }

[case.primary]
effect = "none"

[case.backport]
effect = "none"

[[case]]
name = "velocity-loader-enable-parameter-in-json-body"
kind = "attack"
via = "request"

[case.request]
method = "POST"
uri = "/solr/demo/config"
headers = { "User-Agent" = "Mozilla/5.0 (X11; Linux x86_64) Firefox/128.0", Accept = "text/html", "Content-Type" = "application/json" }
body = "{\"config\":\"{\\\"update-queryresponsewriter\\\":{\\\"name\\\":\\\"velocity\\\",\\\"class\\\":\\\"solr.VelocityResponseWriter\\\",\\\"params.resource.loader.enabled\\\":\\\"true\\\"}}\"}"
body_api = "stream"

[case.primary]
effect = "block"
rule = "request_template_loader_enable"

[case.backport]
effect = "none"
why = "the same input blocks as a query parameter but passes as a JSON body: the agent's request context has no body (no hook reads the input stream or the reader), so body fields are never read"
