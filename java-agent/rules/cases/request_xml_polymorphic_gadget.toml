[[case]]
name = "xstream-gadget-via-input-stream"
kind = "attack"
via = "request"

[case.request]
method = "POST"
uri = "/orders/3/edit"
headers = { User-Agent = "Mozilla/5.0 (X11; Linux x86_64) Firefox/128.0", "Content-Type" = "application/xml" }
body = "<map>\n  <entry>\n    <jdk.nashorn.internal.objects.NativeString>\n      <value class=\"com.sun.xml.internal.bind.v2.runtime.unmarshaller.Base64Data\">\n        <dataHandler>\n          <dataSource class=\"com.sun.xml.internal.ws.encoding.xml.XMLMessage$XmlDataSource\">\n            <is class=\"javax.crypto.CipherInputStream\">\n              <cipher class=\"javax.crypto.NullCipher\">\n                <serviceIterator class=\"javax.imageio.spi.FilterIterator\">\n                  <next class=\"java.lang.ProcessBuilder\">\n                    <command>\n                      <string>touch</string>\n                      <string>/tmp/success</string>\n                    </command>\n                  </next>\n                </serviceIterator>\n              </cipher>\n            </is>\n          </dataSource>\n        </dataHandler>\n      </value>\n    </jdk.nashorn.internal.objects.NativeString>\n  </entry>\n</map>\n"
body_api = "stream"

[case.primary]
effect = "none"
why = "the agent's request context has no body (no hook reads the input stream or the reader), so a rule decided from the body alone cannot fire"

[case.backport]
effect = "none"
why = "the agent's request context has no body (no hook reads the input stream or the reader), so a rule decided from the body alone cannot fire"

