[[case]]
name = "runtime-exec-source-in-request"
kind = "attack"
via = "request-sink"
op = "java.compile"
args = { source = "public class Generated { public void run() throws Exception { Runtime.getRuntime().exec(\"id\"); } }" }

[case.request]
method = "GET"
uri = "/app/report"
query = "id=7"
headers = { User-Agent = "Mozilla/5.0 (X11; Linux x86_64) Firefox/128.0", Accept = "text/html" }

[case.primary]
effect = "block"
rule = "java_compile_runtime"

[case.backport]
effect = "block"
rule = "java_compile_runtime_execution"

