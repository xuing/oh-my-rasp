[[case]]
name = "bean-comparator-outside-request"
kind = "attack"
via = "sink"
op = "deserialize"
args = { class = "org.apache.commons.beanutils.BeanComparator" }
stubs = ["org.apache.commons.beanutils.BeanComparator", "org.apache.commons.beanutils.BeanMap"]

[case.primary]
effect = "block"
rule = "deserialization_gadget"

[case.backport]
effect = "block"
rule = "deserialization_gadget_class"

[[case]]
