uri = "/app/report"
query = "id=7"
headers = { User-Agent = "Mozilla/5.0 (X11; Linux x86_64) Firefox/128.0", Accept = "text/html" }

[case.primary]
effect = "block"
rule = "deserialization_gadget"

[case.backport]
effect = "block"
rule = "deserialization_gadget_class"

