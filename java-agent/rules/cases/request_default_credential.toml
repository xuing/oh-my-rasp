[[case]]
name = "tomcat-basic-default"
kind = "attack"
via = "request"

[case.request]
method = "GET"
uri = "/manager/html"
headers = { User-Agent = "Mozilla/5.0 (X11; Linux x86_64) Firefox/128.0", Accept = "text/html", Authorization = "Basic dG9tY2F0OnRvbWNhdA==" }

[case.primary]
effect = "block"
rule = "request_default_credential"

[case.backport]
effect = "unreachable"
why = "the backports have no request-entry rule for this input"

[[case]]
name = "benign-basic-strong-password"
kind = "benign"
via = "request"

[case.request]
method = "GET"
uri = "/admin"
headers = { User-Agent = "Mozilla/5.0 (X11; Linux x86_64) Firefox/128.0", Accept = "text/html", Authorization = "Basic YWRtaW46c3Ryb25nLXBhc3N3b3Jk" }

[case.primary]
effect = "none"

[case.backport]
effect = "none"
