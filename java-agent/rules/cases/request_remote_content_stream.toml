[[case]]
name = "stream-url-file"
kind = "attack"
via = "request"

[case.request]
method = "GET"
uri = "/solr/demo/debug/dump"
query = "stream.url=file%3A%2F%2F%2Fetc%2Fpasswd"
headers = { User-Agent = "Mozilla/5.0 (X11; Linux x86_64) Firefox/128.0", Accept = "text/html" }

[case.primary]
effect = "block"
rule = "request_remote_content_stream"

[case.backport]
effect = "unreachable"
why = "the backports have no request-entry rule for this input"

[[case]]
name = "benign-stream-url-https"
kind = "benign"
via = "request"

[case.request]
method = "GET"
uri = "/solr/demo/debug/dump"
query = "stream.url=https%3A%2F%2Fexample.com%2Ffeed.xml"
headers = { User-Agent = "Mozilla/5.0 (X11; Linux x86_64) Firefox/128.0", Accept = "text/html" }

[case.primary]
effect = "none"

[case.backport]
effect = "none"
