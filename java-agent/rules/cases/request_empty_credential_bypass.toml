[[case]]
name = "empty-credentials-with-bypass-flag"
kind = "attack"
via = "request"

[case.request]
method = "POST"
uri = "/webtools/control/ProgramExport/"
query = "USERNAME=&PASSWORD=&requirePasswordChange=Y"
headers = { User-Agent = "Mozilla/5.0 (X11; Linux x86_64) Firefox/128.0", Accept = "text/html" }

[case.primary]
effect = "block"
rule = "request_empty_credential_bypass"

[case.backport]
effect = "unreachable"
why = "the backports have no request-entry rule for this input"

[[case]]
name = "benign-empty-credentials"
kind = "benign"
via = "request"

[case.request]
method = "POST"
uri = "/webtools/control/ProgramExport/"
query = "USERNAME=&PASSWORD="
headers = { User-Agent = "Mozilla/5.0 (X11; Linux x86_64) Firefox/128.0", Accept = "text/html" }

[case.primary]
effect = "none"

[case.backport]
effect = "none"
