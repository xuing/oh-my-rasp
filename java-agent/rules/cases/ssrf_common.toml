[[case]]
name = "callback-domain-outside-request"
kind = "attack"
via = "sink"
op = "net.open"
args = { url = "http://abc123.dnslog.cn/" }

[case.primary]
effect = "block"
rule = "ssrf_common"

[case.backport]
effect = "unreachable"
why = "the backports have no list of callback domains for outbound URLs"

[[case]]
name = "callback-domain-in-request"
kind = "attack"
via = "request-sink"
op = "net.open"
args = { url = "http://abc123.dnslog.cn/" }

[case.request]
method = "GET"
uri = "/app/report"
query = "id=7"
headers = { User-Agent = "Mozilla/5.0 (X11; Linux x86_64) Firefox/128.0", Accept = "text/html" }

[case.primary]
effect = "block"
rule = "ssrf_common"

[case.backport]
effect = "unreachable"
why = "the backports have no list of callback domains for outbound URLs"

[[case]]
name = "benign-partner-domain"
kind = "benign"
via = "sink"
op = "net.open"
args = { url = "http://reports.example.com/weekly" }

[case.primary]
effect = "none"

[case.backport]
effect = "none"
