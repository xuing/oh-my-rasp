[[case]]
name = "request-shell-syntax-past-the-body-cap"
kind = "attack"
via = "request-sink"
op = "process.exec"
args = { argv = ["sh", "-c", "echo 127.0.0.1; id"] }

[case.request]
method = "POST"
uri = "/app/ping"
headers = { "User-Agent" = "Mozilla/5.0 (X11; Linux x86_64) Firefox/128.0", Accept = "text/html", "Content-Type" = "application/json" }
body = "{\"username\":\"a\",\"password\":\"hunter2-Secret\",\"pad\":\"\",\"host\":\"127.0.0.1; id\"}"
body_api = "stream"
body_chunk = 4096

[case.primary]
effect = "none"
why = "the field starts past the first 8192 bytes of the body, which is all the agent records (the cap): the value is never extracted, so the sink is not correlated with it"

[case.backport]
effect = "none"
why = "the field starts past the first 8192 bytes of the body, which is all the agent records (the cap): the value is never extracted, so the sink is not correlated with it"

