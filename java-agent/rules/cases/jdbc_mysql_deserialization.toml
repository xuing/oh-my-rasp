[[case]]
name = "mysql-autodeserialize-outside-request"
kind = "attack"
via = "sink"
op = "jdbc.connect"
args = { url = "jdbc:mysql://127.0.0.1:3306/test?autoDeserialize=true&queryInterceptors=com.mysql.cj.jdbc.interceptors.ServerStatusDiffInterceptor" }

[case.primary]
effect = "none"
why = "the primary flags this URL only when a request parameter carries it; outside a request there is none"

[case.backport]
effect = "block"
rule = "jdbc_mysql_deserialization"

[[case]]
name = "mysql-autodeserialize-in-request"
kind = "attack"
via = "request-sink"
op = "jdbc.connect"
args = { url = "jdbc:mysql://127.0.0.1:3306/test?autoDeserialize=true&queryInterceptors=com.mysql.cj.jdbc.interceptors.ServerStatusDiffInterceptor" }

[case.request]
method = "GET"
uri = "/app/report"
query = "id=7"
headers = { User-Agent = "Mozilla/5.0 (X11; Linux x86_64) Firefox/128.0", Accept = "text/html" }

[case.primary]
effect = "none"
why = "the primary flags this URL only when a request parameter carries it; this request does not"

[case.backport]
effect = "block"
rule = "jdbc_mysql_deserialization"

[[case]]
name = "benign-mysql-url"
kind = "benign"
via = "sink"
op = "jdbc.connect"
args = { url = "jdbc:mysql://127.0.0.1:3306/reports?useSSL=false" }

[case.primary]
effect = "none"

[case.backport]
effect = "none"

[[case]]
name = "request-selects-mysql-url"
kind = "attack"
via = "request-sink"
op = "jdbc.connect"
args = { url = "jdbc:mysql://127.0.0.1:3306/test?autoDeserialize=true&queryInterceptors=com.mysql.cj.jdbc.interceptors.ServerStatusDiffInterceptor" }

[case.request]
method = "POST"
uri = "/app/datasource/test"
query = "url=jdbc%3Amysql%3A%2F%2F127.0.0.1%3A3306%2Ftest%3FautoDeserialize%3Dtrue%26queryInterceptors%3Dcom.mysql.cj.jdbc.interceptors.ServerStatusDiffInterceptor"
headers = { User-Agent = "Mozilla/5.0 (X11; Linux x86_64) Firefox/128.0", Accept = "text/html" }

[case.primary]
effect = "block"
rule = "jdbc_mysql_deserialization"

[case.backport]
effect = "block"
rule = "jdbc_mysql_deserialization"
