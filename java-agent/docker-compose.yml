name: ohmyrasp

services:
  baseline:
    build:
      context: .
      pull: true
    image: ohmyrasp/playground:latest
    ports:
      - "${OHMYRASP_BASELINE_PORT:-18080}:8080"
    environment:
      OHMYRASP_ENV: baseline
    volumes:
      - ./logs/baseline:/opt/ohmyrasp/logs

  protected:
    image: ohmyrasp/playground:latest
    depends_on:
      - baseline
    ports:
      - "${OHMYRASP_PROTECTED_PORT:-18081}:8080"
    environment:
      OHMYRASP_LOG: /opt/ohmyrasp/logs/events.jsonl
      OHMYRASP_BLOCK: "true"
      CATALINA_OPTS: "-javaagent:/opt/ohmyrasp/ohmyrasp-agent.jar -Dohmyrasp.log=/opt/ohmyrasp/logs/events.jsonl -Dohmyrasp.block=true"
    volumes:
      - ./logs/protected:/opt/ohmyrasp/logs
