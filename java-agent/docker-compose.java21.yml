        TOMCAT_IMAGE: tomcat:9.0-jdk21-temurin
        PLAYGROUND_PROJECT: playground-java17
    image: ohmyrasp/playground:tomcat9-java21
    ports:
      - "${OHMYRASP_TOMCAT9_JAVA21_BASELINE_PORT:-18234}:8080"
    environment:
      OHMYRASP_ENV: tomcat9-java21-baseline
    volumes:
      - ./logs/tomcat9-java21-baseline:/opt/ohmyrasp/logs
    extra_hosts: *extra-hosts

  tomcat9-java21-protected:
    image: ohmyrasp/playground:tomcat9-java21
    depends_on:
      - tomcat9-java21-baseline
    ports:
      - "${OHMYRASP_TOMCAT9_JAVA21_PROTECTED_PORT:-18235}:8080"
    environment:
      OHMYRASP_ENV: tomcat9-java21-protected
      OHMYRASP_HOSTNAME: tomcat9-java21-protected
