      - "${OHMYRASP_TOMCAT10_JAVA21_BASELINE_PORT:-18232}:8080"
    environment:
      OHMYRASP_ENV: tomcat10-java21-baseline
    volumes:
      - ./logs/tomcat10-java21-baseline:/opt/ohmyrasp/logs
    extra_hosts: *extra-hosts

  tomcat10-java21-protected:
