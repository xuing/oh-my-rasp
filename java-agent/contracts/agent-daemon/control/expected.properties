# What each golden control document means, written by hand and reviewed with the documents.
#
# <document>.mode      the mode the agent holds after reading the document
# <document>.revision  the revision it reports (primary agent only)
# <document>.disabled  algorithms whose switch is false (primary agent only; comma separated)
# <document>.enabled   algorithms whose switch is explicitly true (primary agent only)
# <document>.policy    none, or control-file when the document installs a policy (primary agent only)
# <document>.policy.version  the version member of that policy
#
# The daemon test checks every entry against the state it wrote the document from. The primary
# agent test checks every field. The backport tests check only the mode: those lines read nothing else.
mode-block.mode=block
mode-block.revision=1
mode-block.disabled=
mode-block.enabled=
mode-block.policy=none

mode-monitor.mode=monitor
mode-monitor.revision=2
mode-monitor.disabled=
mode-monitor.enabled=
mode-monitor.policy=none

mode-off.mode=off
mode-off.revision=3
mode-off.disabled=
mode-off.enabled=
mode-off.policy=none

algorithms-switched.mode=block
algorithms-switched.revision=2
algorithms-switched.disabled=sql_userinput
algorithms-switched.enabled=xss_userinput
algorithms-switched.policy=none

policy-installed.mode=block
policy-installed.revision=3
policy-installed.disabled=sql_userinput
policy-installed.enabled=xss_userinput
policy-installed.policy=control-file
policy-installed.policy.version=4

policy-withdrawn.mode=block
policy-withdrawn.revision=4
policy-withdrawn.disabled=sql_userinput
policy-withdrawn.enabled=xss_userinput
policy-withdrawn.policy=none

policy-escaped.mode=block
policy-escaped.revision=2
policy-escaped.disabled=
policy-escaped.enabled=
policy-escaped.policy=control-file
policy-escaped.policy.version=5
