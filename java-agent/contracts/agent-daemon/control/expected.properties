# What each golden control document means, written by hand and reviewed with the documents.
#
# <document>.mode      the mode the agent holds after reading the document
# <document>.outside_request  block or log: whether a context-dependent finding with no request evidence blocks,
#                      for an agent started with the default (block); every line. Blocking needs both the host's
#                      top-level member and the policy's config.hardening.outside_request to allow it.
# <document>.outside_request.host   the host's top-level member: block, log or none (the daemon test only)
# <document>.outside_request.cloud  the policy's config.hardening.outside_request: block, log or none (the daemon
#                      test only; the agents read it from the policy)
# <document>.revision  the revision it reports (primary agent only)
# <document>.disabled  algorithms whose switch is false (primary agent only; comma separated)
# <document>.enabled   algorithms whose switch is explicitly true (primary agent only)
# <document>.policy    none, or control-file when the document installs a policy (primary agent only)
# <document>.policy.version  the version member of that policy
#
# The daemon test checks every entry against the state it wrote the document from. The primary
# agent test checks every field. The backport tests check the mode and outside_request: those lines
# read nothing else.
