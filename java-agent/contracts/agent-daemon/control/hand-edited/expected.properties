# What each hand-edited control document means, written by hand and reviewed with the documents.
#
# An operator edits the daemon's control file by hand (control.rs says so). Each document here is a
# daemon-written document whose `mode` was changed to a spelling the agents accept. All three
# control tests read them: both agent engines must apply the mode below, and the daemon must read
# the document (keeping its revision and switches, not reinitialising it) and rewrite the mode as
# the canonical word `off`, `monitor` or `block` the next time it writes the file.
#
# <document>.mode      the mode the agent holds, and the canonical word the daemon rewrites
# <document>.revision  the revision the document keeps (primary agent and daemon)
# <document>.disabled  algorithms whose switch is false (primary agent and daemon; comma separated)
# <document>.enabled   algorithms whose switch is explicitly true (primary agent and daemon)
#
# The spellings are exactly those both agent engines accept (AgentRuntime's DetectionMode.parse
# and RaspRuntime.parseMode): off, disabled, none / monitor, record, observe, log / block,
# blocking, protect, in any letter case, with leading and trailing characters up to U+0020 ignored.

alias-disabled.mode=off
alias-disabled.revision=5
alias-disabled.disabled=
alias-disabled.enabled=

alias-none.mode=off
alias-none.revision=6
alias-none.disabled=
alias-none.enabled=

alias-record.mode=monitor
alias-record.revision=7
alias-record.disabled=
alias-record.enabled=

alias-observe.mode=monitor
alias-observe.revision=8
alias-observe.disabled=
alias-observe.enabled=

alias-log.mode=monitor
alias-log.revision=9
alias-log.disabled=
alias-log.enabled=

alias-blocking.mode=block
alias-blocking.revision=10
alias-blocking.disabled=
alias-blocking.enabled=

alias-protect.mode=block
alias-protect.revision=11
alias-protect.disabled=sql_userinput
alias-protect.enabled=

case-upper.mode=block
case-upper.revision=12
case-upper.disabled=
case-upper.enabled=

case-mixed.mode=monitor
case-mixed.revision=13
case-mixed.disabled=
case-mixed.enabled=

padded.mode=monitor
padded.revision=14
padded.disabled=
padded.enabled=xss_userinput
