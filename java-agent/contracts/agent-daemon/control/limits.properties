# Values both sides of the control file share, written by hand.
#
# max_control_bytes  The largest control document, in bytes, that the agents read: both agent
#                    engines ignore a file larger than this (a document of exactly this size is
#                    read). The daemon refuses to write a larger one and keeps the previous
#                    document. Each side's test compares its own constant with this value:
#                    daemon/src/control.rs MAX_CONTROL_BYTES, AgentRuntime.MAX_CONTROL_BYTES and
#                    RaspRuntime.MAX_CONTROL_BYTES.
max_control_bytes=1048576
