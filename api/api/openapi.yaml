components:
  securitySchemes:
    bearerAuth:
      type: http
      scheme: bearer
  parameters:
    AppID:
      name: appID
      in: path
      required: true
      schema: { type: string }
    AgentID:
      name: agentID
      in: path
      required: true
      schema: { type: string }
    PolicyID:
      name: policyID
      in: path
      required: true
      schema: { type: string }
    PolicyVersionNumber:
      name: version
      in: path
      required: true
      schema:
        type: integer
        minimum: 1
    EventType:
      name: type
      in: query
      required: false
      schema:
        type: string
        enum: [attack, hook, performance, crash, error]
    EventApplicationID:
      name: application_id
      in: query
      required: false
      schema: { type: string }
    EventEnvironmentID:
      name: environment_id
      in: query
      required: false
      schema: { type: string }
    EventAgentID:
      name: agent_id
      in: query
      required: false
      schema: { type: string }
    EventPolicyID:
      name: policy_id
      in: query
      required: false
      schema: { type: string }
    EventSeverity:
      name: severity
      in: query
      required: false
      schema: { type: string }
    EventHook:
      name: hook
      in: query
      required: false
      schema: { type: string }
    EventOccurredAfter:
      name: occurred_after
      in: query
      required: false
      schema:
        type: string
        format: date-time
    EventOccurredBefore:
      name: occurred_before
      in: query
      required: false
      schema:
        type: string
        format: date-time
    EventLimit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 1000
    DependencyApplicationID:
      name: application_id
      in: query
      required: false
      schema: { type: string }
    DependencyAgentID:
      name: agent_id
      in: query
      required: false
      schema: { type: string }
    DependencyName:
      name: name
      in: query
      required: false
      schema: { type: string }
    DependencyEcosystem:
      name: ecosystem
      in: query
      required: false
      schema: { type: string }
    DependencyVulnerabilitySeverity:
      name: vulnerability_severity
      in: query
      required: false
      schema:
        type: string
        enum: [critical, high, medium, low]
    DependencyObservedAfter:
      name: observed_after
      in: query
      required: false
      schema:
        type: string
        format: date-time
    DependencyObservedBefore:
      name: observed_before
      in: query
      required: false
      schema:
        type: string
        format: date-time
    DependencyLimit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 1000
    BaselineApplicationID:
      name: application_id
      in: query
      required: false
      schema: { type: string }
    BaselineEnvironmentID:
      name: environment_id
      in: query
      required: false
      schema: { type: string }
    BaselineAgentID:
      name: agent_id
      in: query
      required: false
      schema: { type: string }
    BaselineSeverity:
      name: severity
      in: query
      required: false
      schema:
        type: string
        enum: [critical, high, medium, low, info]
    BaselineStatus:
      name: status
      in: query
      required: false
      schema:
        type: string
        enum: [failed, warning, passed, suppressed]
    BaselineCategory:
      name: category
      in: query
      required: false
      schema: { type: string }
    BaselineObservedAfter:
      name: observed_after
      in: query
      required: false
      schema:
        type: string
        format: date-time
    BaselineObservedBefore:
      name: observed_before
      in: query
      required: false
      schema:
        type: string
        format: date-time
    BaselineLimit:
      name: limit
      in: query
      required: false
      schema:
        type: integer
        minimum: 1
        maximum: 1000
    WorkloadID:
      name: workloadID
      in: path
      required: true
      schema: { type: string }
  schemas:
    HealthResponse:
      type: object
      required: [status]
      properties:
        status: { type: string }
    ReadyResponse:
      type: object
      required: [status]
      properties:
        status: { type: string }
    LoginRequest:
      type: object
      required: [email, password]
      properties:
        email: { type: string, format: email }
        password: { type: string }
    LoginResponse:
      type: object
      required: [session, user]
      properties:
        session:
          $ref: "#/components/schemas/Session"
        user:
          $ref: "#/components/schemas/User"
    MeResponse:
      type: object
      required: [user]
      properties:
        user:
          $ref: "#/components/schemas/User"
    Session:
      type: object
      required: [token, user_id, expires_at]
      properties:
        token: { type: string }
        user_id: { type: string }
        expires_at: { type: string, format: date-time }
    UserList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/User"
    User:
      type: object
      required: [id, email, name, roles, created_at, updated_at]
      properties:
        id: { type: string }
        email: { type: string, format: email }
        name: { type: string }
        roles:
          type: array
          items:
            type: string
            enum: [admin, security_engineer, viewer]
        created_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
        disabled_at: { type: string, format: date-time }
    UserCreate:
      type: object
      required: [email, name, password, roles]
      properties:
        email: { type: string, format: email }
        name: { type: string }
        password: { type: string, minLength: 8 }
        roles:
          type: array
          minItems: 1
          items:
            type: string
            enum: [admin, security_engineer, viewer]
    UserUpdate:
      type: object
      required: [name, roles, disabled]
      properties:
        name: { type: string }
        roles:
          type: array
          minItems: 1
          items:
            type: string
            enum: [admin, security_engineer, viewer]
        disabled: { type: boolean }
    ApplicationList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Application"
    Application:
      type: object
      required: [id, name, description, created_at, environment_ids]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        secret: { type: string }
        created_at: { type: string, format: date-time }
        policy_id: { type: string }
        policy_version: { type: integer }
        environment_ids:
          type: array
          items: { type: string }
    ApplicationInput:
      type: object
      required: [name]
      properties:
        name: { type: string }
        description: { type: string }
    Environment:
      type: object
      required: [id, application_id, name, kind, created_at]
      properties:
        id: { type: string }
        application_id: { type: string }
        name: { type: string }
        kind: { type: string }
        created_at: { type: string, format: date-time }
        policy_id: { type: string }
        policy_version: { type: integer }
    EnvironmentInput:
      type: object
      required: [name]
      properties:
        name: { type: string }
        kind: { type: string }
    AgentList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/Agent"
    Agent:
      type: object
      required: [id, application_id, environment_id, hostname, runtime, version, status, last_seen_at]
      properties:
        id: { type: string }
        application_id: { type: string }
        environment_id: { type: string }
        hostname: { type: string }
        alias: { type: string }
        runtime: { type: string }
        version: { type: string }
        status: { type: string }
        last_seen_at: { type: string, format: date-time }
        policy_id: { type: string }
        policy_version: { type: integer }
        ignored_at: { type: string, format: date-time }
    AgentAliasUpdate:
      type: object
      required: [alias]
      properties:
        alias: { type: string }
    AgentIgnoreUpdate:
      type: object
      required: [ignored]
      properties:
        ignored: { type: boolean }
    AgentBatchOperationRequest:
      type: object
      required: [ids]
      properties:
        ids:
          type: array
          items: { type: string }
    AgentBatchOperationReport:
      type: object
      required: [ids, count]
      properties:
        ids:
          type: array
          items: { type: string }
        count: { type: integer }
    AgentRegistration:
      type: object
      required: [environment_id, hostname, version]
      properties:
        environment_id: { type: string }
        hostname: { type: string }
        runtime: { type: string }
        version: { type: string }
    AgentHeartbeat:
      type: object
      required: [status]
      properties:
        status: { type: string }
    DaemonAccessToken:
      type: object
      required: [access_token, updated_at]
      properties:
        access_token: { type: string }
        updated_at: { type: string, format: date-time }
    DaemonCommandList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/DaemonCommandGroup"
    DaemonCommandGroup:
      type: object
      required: [application_id, application_secret, language, workloads]
      properties:
        application_id: { type: string }
        application_secret: { type: string }
        language:
          type: string
          enum: [java]
        workloads:
          type: array
          items:
            $ref: "#/components/schemas/DaemonWorkload"
    DaemonApplication:
      type: object
      required: [application_id, application_secret, language]
      properties:
        application_id: { type: string }
        application_secret: { type: string }
        language:
          type: string
          enum: [java]
    AgentArtifactInfo:
      type: object
      required: [filename, content_type, md5, size, language, system_type, language_version]
      properties:
        filename: { type: string }
        content_type: { type: string }
        md5: { type: string }
        size:
          type: integer
          format: int64
        language:
          type: string
          enum: [java]
        system_type: { type: string }
        language_version: { type: string }
    AgentArtifactCatalog:
      type: object
      required: [artifact_dir_configured, generated_bootstrap_enabled, items]
      properties:
        artifact_dir_configured: { type: boolean }
        generated_bootstrap_enabled: { type: boolean }
        items:
          type: array
          items:
            $ref: "#/components/schemas/AgentArtifactCatalogItem"
    AgentArtifactCatalogItem:
      type: object
      required: [filename, content_type, md5, size, language, system_type, language_version, source, updated_at]
      properties:
        filename: { type: string }
        content_type: { type: string }
        md5: { type: string }
        size:
          type: integer
          format: int64
        language: { type: string }
        system_type: { type: string }
        language_version: { type: string }
        source: { type: string }
        updated_at: { type: string, format: date-time }
    AgentArtifactUpload:
      type: object
      required: [language, system_type, language_version, content_base64]
      properties:
        filename:
          type: string
          description: Original operator-provided ZIP filename. The server stores artifacts using a canonical name derived from language, system_type, and language_version.
        language:
          type: string
          enum: [java]
        system_type:
          type: string
          examples: [linux]
        language_version:
          type: string
          examples: ["17"]
        content_base64:
          type: string
          description: Base64-encoded Agent ZIP package.
    DaemonWorkloadList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/DaemonWorkload"
    DaemonWorkload:
      type: object
      required: [id, node_name, type, observed_at, updated_at]
      properties:
        id: { type: string }
        application_id: { type: string }
        node_name: { type: string }
        type:
          type: string
          enum: [process, container]
        pid: { type: integer }
        cmdline:
          type: array
          items: { type: string }
        container_id: { type: string }
        container_name: { type: string }
        image_id: { type: string }
        image_tag: { type: string }
        injection_status:
          type: string
          enum: [injected, failed, uninstalled]
        injection_error: { type: string }
        injection_helper_id: { type: string }
        injection_helper_version: { type: string }
        injection_reported_at: { type: string, format: date-time }
        injection_status_updated_at: { type: string, format: date-time }
        observed_at: { type: string, format: date-time }
        updated_at: { type: string, format: date-time }
    DaemonInjectionReport:
      type: object
      required: [workload_id, status]
      properties:
        workload_id: { type: string }
        status:
          type: string
          enum: [injected, failed, uninstalled]
        error: { type: string }
        helper_id: { type: string }
        helper_version: { type: string }
        reported_at: { type: string, format: date-time }
    DaemonWorkloadReport:
      type: object
      required: [node_name, workloads]
      properties:
        node_name: { type: string }
        workloads:
          type: array
          items:
            $ref: "#/components/schemas/DaemonWorkloadInput"
    DaemonWorkloadInput:
      type: object
      required: [type]
      properties:
        type:
          type: string
          enum: [process, container]
        pid: { type: integer }
        cmdline:
          type: array
          items: { type: string }
        container_id: { type: string }
        container_name: { type: string }
        image_id: { type: string }
        image_tag: { type: string }
        observed_at: { type: string, format: date-time }
    DaemonWorkloadBinding:
      type: object
      required: [application_id]
      properties:
        application_id: { type: string }
    PolicySetInput:
      type: object
      required: [name]
      properties:
        name: { type: string }
        description: { type: string }
    PolicySetList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PolicySet"
    PolicySet:
      type: object
      required: [id, name, description, created_at, versions]
      properties:
        id: { type: string }
        name: { type: string }
        description: { type: string }
        created_at: { type: string, format: date-time }
        active:
          $ref: "#/components/schemas/PolicyVersion"
        versions:
          type: array
          items:
            $ref: "#/components/schemas/PolicyVersion"
    PolicyAlgorithmCatalog:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/PolicyAlgorithm"
    PolicyAlgorithm:
      type: object
      required: [hook, algorithms]
      properties:
        hook: { type: string }
        algorithms:
          type: array
          items: { type: string }
    PolicyVersion:
      type: object
      required: [version, status, rules, canary_percent, created_at]
      properties:
        version: { type: integer }
        status: { type: string }
        rules:
          type: array
          items:
            $ref: "#/components/schemas/Rule"
        canary_percent: { type: integer }
        created_at: { type: string, format: date-time }
        published_at: { type: string, format: date-time }
    Rule:
      type: object
      required: [id, name, hook, algorithm, action, severity, expression, tags, description]
      properties:
        id: { type: string }
        name: { type: string }
        hook: { type: string }
        algorithm: { type: string }
        action: { type: string }
        severity: { type: string }
        expression: { type: string }
        tags:
          type: array
          items: { type: string }
        description: { type: string }
    PolicyVersionInput:
      type: object
      required: [rules]
      properties:
        rules:
          type: array
          items:
            $ref: "#/components/schemas/RuleInput"
    RuleListInput:
      type: object
      required: [rules]
      properties:
        rules:
          type: array
          items:
            $ref: "#/components/schemas/RuleInput"
    RuleInput:
      type: object
      required: [name, hook, expression]
      properties:
        id: { type: string }
        name: { type: string }
        hook: { type: string }
        algorithm: { type: string }
        action:
          type: string
          enum: [log, block, ignore]
        severity: { type: string }
        expression: { type: string }
        tags:
          type: array
          items: { type: string }
        description: { type: string }
    RuleValidation:
      type: object
      required: [valid, errors]
      properties:
        valid: { type: boolean }
        errors:
          type: array
          items: { type: string }
    RuleTestInput:
      type: object
      required: [rule, event]
      properties:
        rule:
          $ref: "#/components/schemas/RuleInput"
        event:
          $ref: "#/components/schemas/SecurityEventInput"
    RuleTestResult:
      type: object
      required: [matched, action, algorithm, confidence]
      properties:
        matched: { type: boolean }
        action: { type: string }
        algorithm: { type: string }
        confidence: { type: integer }
    PolicyRolloutInput:
      type: object
      required: [version, canary_percent]
      properties:
        version: { type: integer }
        canary_percent: { type: integer, minimum: 0, maximum: 100 }
        application_id: { type: string }
        environment_id: { type: string }
    SecurityEventList:
      type: object
      required: [items]
      properties:
        items:
          type: array
          items:
            $ref: "#/components/schemas/SecurityEvent"
