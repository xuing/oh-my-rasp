openapi: 3.1.0
info:
  title: OhMyRasp Control Plane API
  version: 0.1.0
  summary: Self-hosted single-organization RASP control platform API.
servers:
  - url: http://localhost:8080
security:
  - bearerAuth: []
paths:
  /healthz:
    get:
      security: []
      responses:
        "200":
          description: Process liveness.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/HealthResponse"
  /readyz:
    get:
      security: []
      responses:
        "200":
          description: Dependency readiness.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ReadyResponse"
  /metrics:
    get:
      security: []
      responses:
        "200":
          description: Prometheus text metrics.
  /api/v1/auth/login:
    post:
      security: []
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/LoginRequest"
      responses:
        "200":
          description: Session and user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/LoginResponse"
  /api/v1/me:
    get:
      responses:
        "200":
          description: Current user.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/MeResponse"
  /api/v1/users:
    get:
      responses:
        "200":
          description: User administration list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/UserList"
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserCreate"
      responses:
        "201":
          description: User created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
  /api/v1/users/{userID}:
    put:
      parameters:
        - name: userID
          in: path
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/UserUpdate"
      responses:
        "200":
          description: User updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/User"
  /api/v1/applications:
    get:
      responses:
        "200":
          description: Application list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationList"
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/ApplicationInput"
      responses:
        "201":
          description: Application created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
  /api/v1/applications/export:
    get:
      responses:
        "200":
          description: Exportable application inventory.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/ApplicationList"
  /api/v1/applications/{appID}:
    delete:
      parameters:
        - $ref: "#/components/parameters/AppID"
      responses:
        "204":
          description: Application removed from active inventory.
  /api/v1/applications/{appID}/environments:
    post:
      parameters:
        - $ref: "#/components/parameters/AppID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EnvironmentInput"
      responses:
        "201":
          description: Environment created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Environment"
  /api/v1/applications/{appID}/secret/rotate:
    post:
      parameters:
        - $ref: "#/components/parameters/AppID"
      responses:
        "200":
          description: Application secret rotated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Application"
  /api/v1/daemon/token:
    get:
      responses:
        "200":
          description: Current daemon access token.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DaemonAccessToken"
  /api/v1/daemon/token/reset:
    post:
      responses:
        "200":
          description: Daemon access token rotated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DaemonAccessToken"
  /api/v1/daemon/workloads:
    get:
      responses:
        "200":
          description: Daemon-reported process and container workloads.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DaemonWorkloadList"
  /api/v1/daemon/commands:
    get:
      security: []
      parameters:
        - name: X-OhMyRasp-Daemon-Token
          in: header
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Bound workload install commands grouped by application.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DaemonCommandList"
  /api/v1/daemon/app:
    get:
      security: []
      parameters:
        - name: X-OhMyRasp-Daemon-Token
          in: header
          required: true
          schema: { type: string }
        - name: app_id
          in: query
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Daemon-visible application credentials.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DaemonApplication"
  /api/v1/daemon/artifacts/agent/info:
    get:
      security: []
      parameters:
        - name: X-OhMyRasp-Daemon-Token
          in: header
          required: true
          schema: { type: string }
        - name: app_id
          in: query
          required: true
          schema: { type: string }
        - name: language
          in: query
          required: true
          schema:
            type: string
            enum: [java]
        - name: system_type
          in: query
          required: false
          schema: { type: string, default: linux }
        - name: language_version
          in: query
          required: false
          schema: { type: string, default: unknown }
      responses:
        "200":
          description: Agent artifact metadata used by daemon-side caching.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentArtifactInfo"
  /api/v1/daemon/artifacts/agent:
    get:
      security: []
      parameters:
        - name: X-OhMyRasp-Daemon-Token
          in: header
          required: true
          schema: { type: string }
        - name: app_id
          in: query
          required: true
          schema: { type: string }
        - name: language
          in: query
          required: true
          schema:
            type: string
            enum: [java]
        - name: system_type
          in: query
          required: false
          schema: { type: string, default: linux }
        - name: language_version
          in: query
          required: false
          schema: { type: string, default: unknown }
      responses:
        "200":
          description: Agent ZIP artifact for daemon injection.
          content:
            application/zip:
              schema:
                type: string
                format: binary
  /api/v1/agent-artifacts:
    get:
      responses:
        "200":
          description: Operator-visible Agent artifact package catalog.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentArtifactCatalog"
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentArtifactUpload"
      responses:
        "201":
          description: Agent artifact uploaded to the managed package catalog.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentArtifactCatalogItem"
  /api/v1/daemon/workloads/report:
    post:
      security: []
      parameters:
        - name: X-OhMyRasp-Daemon-Token
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DaemonWorkloadReport"
      responses:
        "200":
          description: Daemon workload inventory accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DaemonWorkloadList"
  /api/v1/daemon/injection-reports:
    post:
      security: []
      parameters:
        - name: X-OhMyRasp-Daemon-Token
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DaemonInjectionReport"
      responses:
        "200":
          description: Daemon workload injection outcome accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DaemonWorkload"
  /api/v1/daemon/workloads/{workloadID}/bind:
    post:
      parameters:
        - $ref: "#/components/parameters/WorkloadID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/DaemonWorkloadBinding"
      responses:
        "200":
          description: Workload bound to an application.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DaemonWorkload"
  /api/v1/daemon/workloads/{workloadID}/unbind:
    post:
      parameters:
        - $ref: "#/components/parameters/WorkloadID"
      responses:
        "200":
          description: Workload unbound from any application.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/DaemonWorkload"
  /api/v1/agents:
    get:
      responses:
        "200":
          description: Agent inventory.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentList"
  /api/v1/agents/batch-delete:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentBatchOperationRequest"
      responses:
        "200":
          description: Agents removed from active inventory.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentBatchOperationReport"
  /api/v1/agents/{agentID}:
    delete:
      parameters:
        - $ref: "#/components/parameters/AgentID"
      responses:
        "200":
          description: Agent removed from active inventory.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/AgentBatchOperationReport"
  /api/v1/agents/{agentID}/alias:
    put:
      parameters:
        - $ref: "#/components/parameters/AgentID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentAliasUpdate"
      responses:
        "200":
          description: Agent operator remark updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
  /api/v1/agents/{agentID}/ignore:
    post:
      parameters:
        - $ref: "#/components/parameters/AgentID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentIgnoreUpdate"
      responses:
        "200":
          description: Agent ignored state updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
  /api/v1/agents/register:
    post:
      security: []
      parameters:
        - name: X-OhMyRasp-App-ID
          in: header
          required: true
          schema: { type: string }
        - name: X-OhMyRasp-App-Secret
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentRegistration"
      responses:
        "201":
          description: Agent registered.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
  /api/v1/agents/{agentID}/heartbeat:
    post:
      security: []
      parameters:
        - $ref: "#/components/parameters/AgentID"
        - name: X-OhMyRasp-App-ID
          in: header
          required: true
          schema: { type: string }
        - name: X-OhMyRasp-App-Secret
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/AgentHeartbeat"
      responses:
        "200":
          description: Agent heartbeat accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/Agent"
  /api/v1/agents/{agentID}/policy:
    get:
      security: []
      parameters:
        - $ref: "#/components/parameters/AgentID"
        - name: X-OhMyRasp-App-ID
          in: header
          required: true
          schema: { type: string }
        - name: X-OhMyRasp-App-Secret
          in: header
          required: true
          schema: { type: string }
      responses:
        "200":
          description: Active or canary policy for the Agent.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyVersion"
  /api/v1/policies:
    get:
      responses:
        "200":
          description: Policy set list.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicySetList"
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PolicySetInput"
      responses:
        "201":
          description: Policy set created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicySet"
  /api/v1/policies/algorithms:
    get:
      responses:
        "200":
          description: Supported policy hook and algorithm catalog.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicyAlgorithmCatalog"
  /api/v1/policies/{policyID}/restore-default:
    post:
      parameters:
        - $ref: "#/components/parameters/PolicyID"
      responses:
        "200":
          description: Default policy algorithms restored as a new draft version.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicySet"
  /api/v1/policies/{policyID}/versions:
    post:
      parameters:
        - $ref: "#/components/parameters/PolicyID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PolicyVersionInput"
      responses:
        "201":
          description: Policy version created.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicySet"
  /api/v1/policies/{policyID}/versions/{version}/rules:
    put:
      parameters:
        - $ref: "#/components/parameters/PolicyID"
        - $ref: "#/components/parameters/PolicyVersionNumber"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PolicyVersionInput"
      responses:
        "200":
          description: Draft policy version rules updated.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicySet"
  /api/v1/policies/validate:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RuleListInput"
      responses:
        "200":
          description: Rule validation result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuleValidation"
  /api/v1/policies/test:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/RuleTestInput"
      responses:
        "200":
          description: Rule test result.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/RuleTestResult"
  /api/v1/policies/{policyID}/rollout:
    post:
      parameters:
        - $ref: "#/components/parameters/PolicyID"
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/PolicyRolloutInput"
      responses:
        "200":
          description: Canary or full rollout applied.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicySet"
  /api/v1/policies/{policyID}/rollback:
    post:
      parameters:
        - $ref: "#/components/parameters/PolicyID"
      responses:
        "200":
          description: Rollback applied.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/PolicySet"
  /api/v1/events/attack:
    get:
      parameters:
        - $ref: "#/components/parameters/EventApplicationID"
        - $ref: "#/components/parameters/EventEnvironmentID"
        - $ref: "#/components/parameters/EventAgentID"
        - $ref: "#/components/parameters/EventPolicyID"
        - $ref: "#/components/parameters/EventSeverity"
        - $ref: "#/components/parameters/EventHook"
        - $ref: "#/components/parameters/EventOccurredAfter"
        - $ref: "#/components/parameters/EventOccurredBefore"
        - $ref: "#/components/parameters/EventLimit"
      responses:
        "200":
          description: Attack events.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecurityEventList"
    post:
      security: []
      parameters:
        - name: X-OhMyRasp-App-ID
          in: header
          required: true
          schema: { type: string }
        - name: X-OhMyRasp-App-Secret
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SecurityEventInput"
      responses:
        "202":
          description: Attack event accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecurityEvent"
  /api/v1/events/hook:
    get:
      parameters:
        - $ref: "#/components/parameters/EventApplicationID"
        - $ref: "#/components/parameters/EventEnvironmentID"
        - $ref: "#/components/parameters/EventAgentID"
        - $ref: "#/components/parameters/EventPolicyID"
        - $ref: "#/components/parameters/EventSeverity"
        - $ref: "#/components/parameters/EventHook"
        - $ref: "#/components/parameters/EventOccurredAfter"
        - $ref: "#/components/parameters/EventOccurredBefore"
        - $ref: "#/components/parameters/EventLimit"
      responses:
        "200":
          description: Hook events.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecurityEventList"
    post:
      security: []
      parameters:
        - name: X-OhMyRasp-App-ID
          in: header
          required: true
          schema: { type: string }
        - name: X-OhMyRasp-App-Secret
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SecurityEventInput"
      responses:
        "202":
          description: Hook event accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecurityEvent"
  /api/v1/events/performance:
    get:
      parameters:
        - $ref: "#/components/parameters/EventApplicationID"
        - $ref: "#/components/parameters/EventEnvironmentID"
        - $ref: "#/components/parameters/EventAgentID"
        - $ref: "#/components/parameters/EventPolicyID"
        - $ref: "#/components/parameters/EventSeverity"
        - $ref: "#/components/parameters/EventHook"
        - $ref: "#/components/parameters/EventOccurredAfter"
        - $ref: "#/components/parameters/EventOccurredBefore"
        - $ref: "#/components/parameters/EventLimit"
      responses:
        "200":
          description: Performance events.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecurityEventList"
    post:
      security: []
      parameters:
        - name: X-OhMyRasp-App-ID
          in: header
          required: true
          schema: { type: string }
        - name: X-OhMyRasp-App-Secret
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SecurityEventInput"
      responses:
        "202":
          description: Performance event accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecurityEvent"
  /api/v1/events/crash:
    get:
      parameters:
        - $ref: "#/components/parameters/EventApplicationID"
        - $ref: "#/components/parameters/EventEnvironmentID"
        - $ref: "#/components/parameters/EventAgentID"
        - $ref: "#/components/parameters/EventPolicyID"
        - $ref: "#/components/parameters/EventSeverity"
        - $ref: "#/components/parameters/EventHook"
        - $ref: "#/components/parameters/EventOccurredAfter"
        - $ref: "#/components/parameters/EventOccurredBefore"
        - $ref: "#/components/parameters/EventLimit"
      responses:
        "200":
          description: Crash events.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecurityEventList"
    post:
      security: []
      parameters:
        - name: X-OhMyRasp-App-ID
          in: header
          required: true
          schema: { type: string }
        - name: X-OhMyRasp-App-Secret
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SecurityEventInput"
      responses:
        "202":
          description: Crash event accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecurityEvent"
  /api/v1/events/error:
    get:
      parameters:
        - $ref: "#/components/parameters/EventApplicationID"
        - $ref: "#/components/parameters/EventEnvironmentID"
        - $ref: "#/components/parameters/EventAgentID"
        - $ref: "#/components/parameters/EventPolicyID"
        - $ref: "#/components/parameters/EventSeverity"
        - $ref: "#/components/parameters/EventHook"
        - $ref: "#/components/parameters/EventOccurredAfter"
        - $ref: "#/components/parameters/EventOccurredBefore"
        - $ref: "#/components/parameters/EventLimit"
      responses:
        "200":
          description: Error events.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecurityEventList"
    post:
      security: []
      parameters:
        - name: X-OhMyRasp-App-ID
          in: header
          required: true
          schema: { type: string }
        - name: X-OhMyRasp-App-Secret
          in: header
          required: true
          schema: { type: string }
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/SecurityEventInput"
      responses:
        "202":
          description: Error event accepted.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecurityEvent"
  /api/v1/events/recycle-bin:
    get:
      parameters:
        - $ref: "#/components/parameters/EventType"
        - $ref: "#/components/parameters/EventApplicationID"
        - $ref: "#/components/parameters/EventEnvironmentID"
        - $ref: "#/components/parameters/EventAgentID"
        - $ref: "#/components/parameters/EventPolicyID"
        - $ref: "#/components/parameters/EventSeverity"
        - $ref: "#/components/parameters/EventHook"
        - $ref: "#/components/parameters/EventOccurredAfter"
        - $ref: "#/components/parameters/EventOccurredBefore"
        - $ref: "#/components/parameters/EventLimit"
      responses:
        "200":
          description: Deleted security events.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/SecurityEventList"
  /api/v1/events/recycle-bin/delete:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventRecycleBinAction"
      responses:
        "200":
          description: Events moved to the recycle bin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventRecycleBinReport"
  /api/v1/events/recycle-bin/restore:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: "#/components/schemas/EventRecycleBinAction"
      responses:
        "200":
          description: Events restored from the recycle bin.
          content:
            application/json:
              schema:
                $ref: "#/components/schemas/EventRecycleBinReport"
  /api/v1/events/recycle-bin/purge:
    post:
      requestBody:
        required: true
        content:
          application/json:
            schema:
